<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f4efe5" />
  <title>小羊牧场 · Low-Poly Ranch</title>
  <style>
    :root {
      --bg: #f4efe5;
      --ink: #4b4137;
      --muted: #8d8173;
      --card: rgba(255, 252, 246, 0.88);
      --line: rgba(120, 98, 66, 0.13);
      --btn: #f3ece0;
      --btn-hover: #ebe2d2;
      --accent: #ff8a3d;
      --accent-ink: #ffffff;
      --danger: #dd634e;
      --shadow: 0 10px 34px rgba(98, 76, 44, 0.13), 0 2px 6px rgba(98, 76, 44, 0.06);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
      font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none; overscroll-behavior: none;
    }
    #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; outline: none; }

    /* 顶部栏 */
    .topbar {
      position: fixed; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between;
      align-items: flex-start; gap: 10px; pointer-events: none; z-index: 5;
    }
    .topbar > * { pointer-events: auto; }
    .brand {
      display: flex; align-items: center; gap: 10px; padding: 9px 14px 9px 10px; border-radius: 16px;
      background: var(--card); box-shadow: var(--shadow); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .brand svg { flex: none; }
    .brand h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
    .brand small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; }
    .tools { display: flex; gap: 8px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border: 0; border-radius: 13px;
      background: var(--card); color: var(--ink); font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
      box-shadow: var(--shadow); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      transition: transform .15s ease, background .15s ease;
    }
    .chip:hover { background: #fffaf2; }
    .chip:active { transform: scale(0.96); }
    .chip svg { width: 16px; height: 16px; }

    /* 操作提示 */
    .hint {
      position: fixed; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%);
      padding: 9px 16px; border-radius: 999px; background: var(--card); box-shadow: var(--shadow);
      font-size: 12.5px; color: var(--muted); white-space: nowrap; z-index: 3;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      transition: opacity .5s ease, transform .5s ease;
    }
    .hint b { color: var(--ink); font-weight: 600; }
    .hint.faded, body.has-selection .hint { opacity: 0; transform: translate(-50%, 10px); pointer-events: none; }

    /* 选中面板 */
    .panel {
      position: fixed; left: 50%; bottom: calc(16px + var(--safe-b)); width: min(456px, calc(100vw - 20px));
      transform: translateX(-50%); padding: 14px 16px 15px; border-radius: 22px; z-index: 6;
      background: var(--card); box-shadow: var(--shadow); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      transition: opacity .25s ease, transform .3s cubic-bezier(.2, .9, .3, 1.2);
    }
    .panel.hidden { opacity: 0; transform: translate(-50%, 26px); pointer-events: none; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; }
    .who { display: flex; align-items: center; gap: 9px; }
    .who .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 0 4px rgba(255, 138, 61, .18); }
    .who strong { font-size: 15px; }
    .who span { font-size: 12px; color: var(--muted); }
    .icon-btn {
      width: 32px; height: 32px; border: 0; border-radius: 10px; background: var(--btn); color: var(--muted);
      font-size: 18px; line-height: 1; cursor: pointer; display: grid; place-items: center;
    }
    .icon-btn:hover { background: var(--btn-hover); color: var(--ink); }
    .label { font-size: 11.5px; color: var(--muted); margin: 0 2px 6px; display: flex; justify-content: space-between; }
    .label b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
    .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
    .seg button {
      display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 7px; border: 0; border-radius: 13px;
      background: var(--btn); color: var(--ink); font: inherit; cursor: pointer; transition: background .15s ease, transform .12s ease, color .15s;
    }
    .seg button svg { width: 22px; height: 22px; margin-bottom: 1px; }
    .seg button span { font-size: 13px; font-weight: 700; letter-spacing: .2px; }
    .seg button small { font-size: 11px; color: var(--muted); }
    .seg button:hover { background: var(--btn-hover); }
    .seg button:active { transform: scale(.96); }
    .seg button.active { background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 16px rgba(255, 138, 61, .32); }
    .seg button.active small { color: rgba(255, 255, 255, .85); }
    .row { display: flex; align-items: center; gap: 8px; }
    .row + .row { margin-top: 10px; }
    .btn {
      flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 12px;
      border: 0; border-radius: 12px; background: var(--btn); color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background .15s ease, transform .12s ease;
    }
    .btn:hover { background: var(--btn-hover); }
    .btn:active { transform: scale(.96); }
    .btn svg { width: 16px; height: 16px; }
    .btn.grow { flex: 1; }
    .btn.danger { color: var(--danger); }
    .btn.danger:hover { background: #fbe3dc; }
    input[type=range] { flex: 1; min-width: 60px; accent-color: var(--accent); height: 28px; cursor: pointer; touch-action: pan-x; }
    .keys { margin-top: 10px; font-size: 11px; color: var(--muted); text-align: center; }
    .keys kbd {
      font-family: inherit; font-size: 10.5px; padding: 1px 5px; border-radius: 5px; background: var(--btn); color: var(--ink);
      border: 1px solid var(--line);
    }

    /* 提示消息 */
    .toast {
      position: fixed; left: 50%; top: 70px; transform: translate(-50%, -8px); padding: 8px 14px; border-radius: 12px;
      background: rgba(75, 65, 55, .9); color: #fff; font-size: 13px; opacity: 0; pointer-events: none; z-index: 9;
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .nogl[hidden] { display: none; }
    .nogl { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; font-size: 15px; color: var(--muted); }

    @media (max-width: 600px) {
      .topbar { top: 10px; left: 10px; right: 10px; }
      .brand { padding: 7px 11px 7px 8px; }
      .brand small { display: none; }
      .chip { height: 36px; padding: 0 11px; font-size: 13px; }
      .chip .txt { display: none; }
      .hint { font-size: 11.5px; padding: 8px 13px; white-space: normal; width: max-content; max-width: calc(100vw - 24px); text-align: center; }
      .panel { padding: 12px 12px 13px; border-radius: 20px; bottom: calc(10px + var(--safe-b)); }
      .seg button { padding: 7px 2px 6px; }
      .keys { display: none; }
    }
    @media (hover: none) { .keys { display: none; } }
  </style>
</head>
<body>
  <canvas id="scene" tabindex="0" aria-label="低多边形 3D 牧场"></canvas>

  <header class="topbar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <rect width="34" height="34" rx="10" fill="#a7d36f" />
        <g fill="#fffdf8"><circle cx="13" cy="17" r="5.2" /><circle cx="19" cy="15" r="5.6" /><circle cx="21.5" cy="20" r="4.6" /><circle cx="15" cy="21" r="4.6" /></g>
        <ellipse cx="25.6" cy="15.6" rx="3" ry="3.6" fill="#3d3534" />
        <rect x="14" y="23" width="1.8" height="5" rx=".9" fill="#3d3534" /><rect x="20" y="23" width="1.8" height="5" rx=".9" fill="#3d3534" />
      </svg>
      <div>
        <h1>小羊牧场</h1>
        <small id="sheepCount">11 只绵羊</small>
      </div>
    </div>
    <div class="tools">
      <button class="chip" id="addSheep" title="添加一只绵羊">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10" /></svg>
        <span class="txt">添加</span>
      </button>
      <button class="chip" id="resetView" title="重置视角（Home）">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8a5.5 5.5 0 1 0 1.7-4" /><path d="M2.5 2.5v3h3" /></svg>
        <span class="txt">重置视角</span>
      </button>
    </div>
  </header>

  <div class="hint" id="hint"><b>点击</b>绵羊选中 · <b>拖动</b>绵羊移位 · 拖动空白处<b>旋转</b> · 滚轮/双指<b>缩放</b></div>

  <section class="panel hidden" id="panel" aria-hidden="true" aria-label="绵羊控制面板">
    <div class="panel-head">
      <div class="who"><i class="dot"></i><div><strong id="sheepName">绵羊</strong> <span id="sheepState"></span></div></div>
      <button class="icon-btn" id="deselect" title="取消选择（Esc）" aria-label="取消选择">×</button>
    </div>

    <div class="label">动画</div>
    <div class="seg" id="actions" role="group" aria-label="动画">
      <button data-action="Idle" title="待机（1）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="7.5" /><path d="M9.5 10v4M14.5 10v4" /></svg>
        <span>Idle</span><small>待机</small>
      </button>
      <button data-action="Graze" title="吃草（2）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20c1-4 1-8 0-12M9.5 20c.5-3 .3-6-1-9M14 20c0-3 1-6 3-8M18.5 20c0-2 .5-4 2-5.5" /><path d="M3 20h18" /></svg>
        <span>Graze</span><small>吃草</small>
      </button>
      <button data-action="Walk" title="行走（3）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h12M12 7l5 5-5 5" /><path d="M20 6v12" /></svg>
        <span>Walk</span><small>行走</small>
      </button>
      <button data-action="Jump" title="跳跃（4）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c3-9 13-9 16 0" /><path d="M12 4v5M9.5 6.5 12 4l2.5 2.5" /><path d="M3 20h18" /></svg>
        <span>Jump</span><small>跳跃</small>
      </button>
    </div>

    <div class="label">朝向 <b id="headingVal">0°</b></div>
    <div class="row">
      <button class="btn" id="rotL" title="向左转 45°（Q）" aria-label="向左旋转 45 度">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5a5 5 0 1 1 1.6 4.4" /><path d="M3 3.5v4h4" /></svg>45°
      </button>
      <input type="range" id="heading" min="0" max="359" step="1" value="0" aria-label="朝向角度" />
      <button class="btn" id="rotR" title="向右转 45°（E）" aria-label="向右旋转 45 度">
        45°<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 7.5a5 5 0 1 0-1.6 4.4" /><path d="M13 3.5v4H9" /></svg>
      </button>
    </div>
    <div class="row">
      <button class="btn grow" id="dup" title="复制（D）">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="8" rx="2" /><path d="M10.5 3.2V3a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5" /></svg>复制
      </button>
      <button class="btn grow danger" id="del" title="删除（Delete）">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5h11M6.5 4.5V3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1.5M4 4.5l.7 8.6a1 1 0 0 0 1 .9h4.6a1 1 0 0 0 1-.9l.7-8.6" /></svg>删除
      </button>
    </div>
    <div class="keys"><kbd>1</kbd>–<kbd>4</kbd> 切换动画 · <kbd>Q</kbd>/<kbd>E</kbd> 旋转 · <kbd>D</kbd> 复制 · <kbd>Del</kbd> 删除 · <kbd>Esc</kbd> 取消</div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="nogl" id="nogl" hidden>当前浏览器不支持 WebGL，无法显示 3D 牧场。</div>

  <!-- 运行时用全站 /vendor 的 three（ES Module），挂到 window.THREE 后按顺序加载普通脚本 -->
  <script type="module">
    import * as THREE from '/vendor/three/three.module.min.js';
    window.THREE = THREE;
    for (const src of ['js/world.js', 'js/sheep.js', 'js/controls.js', 'js/app.js']) {
      await new Promise((ok, fail) => {
        const s = document.createElement('script');
        s.src = src; s.onload = ok; s.onerror = fail;
        document.body.appendChild(s);
      });
    }
  </script>
</body>
</html>
