<script src="/vendor/spine-3.6/spine-webgl.js"></script>
<script>(async () => {
  const $ = id => document.getElementById(id);
  try {
    const image = new Image();
    image.src = $('texture-data').textContent.trim();
    await image.decode();
    const canvas = $('canvas');
    const context = new spine.webgl.ManagedWebGLRenderingContext(canvas, {alpha: true, antialias: true, preserveDrawingBuffer: true});
    const gl = context.gl;
    if (!gl) throw new Error('此浏览器未启用 WebGL');
    const renderer = new spine.webgl.SceneRenderer(canvas, context, true);
    const atlas = new spine.TextureAtlas(JSON.parse($('atlas-data').textContent), () => new spine.webgl.GLTexture(context, image));
    const data = new spine.SkeletonJson(new spine.AtlasAttachmentLoader(atlas)).readSkeletonData(JSON.parse($('skeleton-data').textContent));
    const skeleton = new spine.Skeleton(data);
    const stateData = new spine.AnimationStateData(data);
    stateData.defaultMix = 0.22;
    const state = new spine.AnimationState(stateData);
    let playing = true, speed = 1, zoom = 1, debug = false, flip = false, name = 'idle', frames = 0;
    let previous = performance.now();
    function select(next, mix = true) {
      name = next;
      if (!mix) { state.clearTracks(); skeleton.setToSetupPose(); }
      state.setAnimation(0, name, true);
      document.querySelectorAll('[data-motion]').forEach(b => {
        b.classList.toggle('active', b.dataset.motion === name);
        b.setAttribute('aria-pressed', String(b.dataset.motion === name));
      });
    }
    function setPlaying(value) { playing = value; $('play').textContent = playing ? '暂停' : '播放'; }
    function draw(delta) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.round(canvas.clientWidth * dpr), height = Math.round(canvas.clientHeight * dpr);
      if (canvas.width !== width || canvas.height !== height) { canvas.width = width; canvas.height = height; }
      gl.viewport(0, 0, width, height);
      gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
      state.update(delta);
      skeleton.flipX = flip;
      state.apply(skeleton); skeleton.updateWorldTransform();
      const aspect = width / height;
      const worldHeight = Math.max(1080, 930 / aspect) / zoom;
      renderer.camera.position.set(flip ? 30 : -30, 420, 0);
      renderer.camera.setViewport(worldHeight * aspect, worldHeight);
      renderer.begin(); renderer.drawSkeleton(skeleton, false);
      if (debug) { renderer.skeletonDebugRenderer.drawMeshTriangles = true; renderer.drawSkeletonDebug(skeleton, false); }
      renderer.end();
      const entry = state.getCurrent(0), duration = entry.animation.duration;
      const time = duration ? entry.trackTime % duration : 0;
      $('timeline').value = duration ? time / duration * 1000 : 0;
      $('time').textContent = `${time.toFixed(2)} / ${duration.toFixed(2)} s`;
      $('status').textContent = playing ? '正在播放' : '已暂停';
      canvas.dataset.frames = String(++frames);
    }
    document.querySelectorAll('[data-motion]').forEach(b => b.onclick = () => select(b.dataset.motion));
    $('play').onclick = () => setPlaying(!playing);
    $('restart').onclick = () => select(name, false);
    $('speed').oninput = e => {speed = +e.target.value; $('speed-label').textContent = speed.toFixed(2) + '×';};
    $('zoom').oninput = e => {zoom = +e.target.value; $('zoom-label').textContent = zoom.toFixed(2) + '×';};
    $('bones').onchange = e => debug = e.target.checked;
    $('flip').onchange = e => flip = e.target.checked;
    $('timeline').oninput = e => {setPlaying(false); state.getCurrent(0).trackTime = +e.target.value / 1000 * state.getCurrent(0).animation.duration; draw(0);};
    document.querySelectorAll('[data-bg]').forEach(b => b.onclick = () => {
      const bg = b.dataset.bg;
      $('stage').classList.toggle('checker', bg === 'checker');
      $('stage').style.background = bg === 'cream' ? 'radial-gradient(ellipse at 50% 35%,#fffdf4,#faf0d9)' : bg === 'dark' ? '#32332e' : '';
      document.querySelectorAll('[data-bg]').forEach(x => x.classList.toggle('active', x === b));
    });
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' && !['INPUT', 'BUTTON', 'SELECT'].includes(e.target.tagName)) {e.preventDefault(); setPlaying(!playing);}
    });
    select('idle', false);
    // Deterministic pose sampling is used for visual validation and GIF capture.
    window.catDemo = {
      ready: true, data, skeleton, state,
      get frames() {return frames;},
      get animation() {return name;},
      sample(animation, time) {setPlaying(false); select(animation, false); state.getCurrent(0).trackTime = time; draw(0);},
      play() {setPlaying(true);},
      setDebug(value) {debug = value; $('bones').checked = value; draw(0);},
    };
    function render(now) {const delta = Math.min((now - previous) / 1000, .05); previous = now; draw(playing ? delta * speed : 0); requestAnimationFrame(render);}
    requestAnimationFrame(render);
  } catch (error) {
    $('status').textContent = '加载失败'; $('error').textContent = error.message || error;
    window.catDemoError = String(error.stack || error);
    console.error(error);
  }
})();
</script>
