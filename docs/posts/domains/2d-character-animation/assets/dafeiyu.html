<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>大肥鱼 · Live2D 模型制作演示</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#34455f;background:#f5f6fb;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:25px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.eyebrow{font-size:10px;letter-spacing:2px;color:#8697b7}h1{font-size:23px;font-weight:650;margin:6px 0}.sub{font-size:12px;color:#8995aa;margin:0}.badge{font-size:10px;border:1px solid #d8dfee;background:#fff;border-radius:20px;padding:8px 12px;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px}.stage{height:620px;position:relative;border:1px solid #dce1ef;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 48% 40%,#fff,#e7edf8)}.stage canvas{position:absolute;inset:0;display:block;width:100%;height:100%}#mesh{pointer-events:none}.stage-label{position:absolute;top:18px;left:20px;font-size:10px;letter-spacing:1px;color:#8d9db7;z-index:2}.stage-status{position:absolute;right:18px;top:18px;font-size:10px;color:#7e8da7;z-index:2}#error{position:absolute;inset:80px 25px auto;color:#a14f5b;font-size:13px;white-space:pre-wrap}.hint{position:absolute;bottom:16px;left:0;width:100%;text-align:center;font-size:10px;color:#8292ae;pointer-events:none}.panel{display:flex;flex-direction:column;gap:18px;max-height:660px;overflow:auto;padding:2px 6px 10px 0}.section-label{font-size:10px;letter-spacing:1px;color:#8b98ae;margin:0 0 9px}.motion-list{display:grid;grid-template-columns:1fr 1fr;gap:7px}button,select{font:inherit;color:inherit;border:1px solid #d8dfed;border-radius:8px;background:#fff;font-size:12px;padding:9px 10px;cursor:pointer}button:hover{background:#edf2fc}button.active{border-color:#8a9fce;background:#e5ebfa;color:#425d96}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px}.field{display:flex;flex-direction:column;gap:8px}.field label{display:flex;justify-content:space-between;font-size:11px;color:#60708e}.field output{font-variant-numeric:tabular-nums;color:#8c99b0}.fields{display:grid;gap:14px}input[type=range]{width:100%;margin:0;accent-color:#8199c7}input[type=checkbox]{accent-color:#8199c7}select{width:100%}.controls{display:flex;gap:8px}.primary{background:#637dad;border-color:#637dad;color:white;flex:1}.primary:hover{background:#526e9e}.timeline{display:flex;align-items:center;gap:12px;margin-top:14px}.timeline span{white-space:nowrap;color:#8c99ae;font-size:10px;font-variant-numeric:tabular-nums}details{font-size:11px;color:#7b8ca8}summary{cursor:pointer;padding:7px 0}details .fields{padding-top:10px}.note{font-size:10px;color:#91a0b8;line-height:1.8;border-top:1px solid #dfe5f0;padding-top:12px}footer{display:flex;justify-content:space-between;font-size:10px;color:#96a3b9;gap:15px;margin-top:18px}footer a{color:inherit}.swatches{display:flex;gap:7px}.swatch{height:23px;width:23px;border-radius:50%;padding:0}.swatch.active{outline:2px solid #849ac3;outline-offset:2px}.checker{background-color:#f2f4f8;background-image:linear-gradient(45deg,#e0e5ee 25%,transparent 25%),linear-gradient(-45deg,#e0e5ee 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e0e5ee 75%),linear-gradient(-45deg,transparent 75%,#e0e5ee 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #6d89bb;outline-offset:3px}.hidden{display:none!important}@media(max-width:700px){main{padding:16px}.layout{grid-template-columns:1fr}.stage{height:490px}.panel{max-height:none;padding:0}.motion-list{grid-template-columns:repeat(3,1fr)}h1{font-size:20px}.badge{font-size:9px}.sub{font-size:10px}footer{line-height:1.7}.fields{gap:13px}.stage-label{font-size:9px}}
</style>
</head>
<body><main>
<header><div><div class="eyebrow">LIVE2D MODEL STUDY</div><h1>大肥鱼 · 动作与参数</h1><p class="sub">拖动滑杆，观察眼睛、嘴巴和转头的网格形变</p></div><span class="badge" id="stats">正在读取模型</span></header>
<div class="layout"><section><div class="stage" id="stage"><canvas id="canvas" aria-label="大肥鱼 Live2D 模型"></canvas><canvas id="mesh" aria-hidden="true"></canvas><span class="stage-label">LIVE2D / REAL-TIME</span><span class="stage-status" id="status" aria-live="polite">正在加载</span><div id="error" role="alert"></div><div class="hint">静态模型与贴图实时渲染</div></div><div class="timeline"><input id="timeline" type="range" min="0" max="1000" value="0" aria-label="动作进度"><span id="time">0.00 / 0.00 s</span></div></section>
<aside class="panel"><section><div class="section-label">动作 / MOTIONS</div><div id="motions" class="motion-list"></div></section>
<div class="controls"><button id="play" class="primary">暂停</button><button id="reset">复位</button></div>
<div class="field"><label for="speed">播放速度 <output id="speed-value">1.00×</output></label><input id="speed" type="range" min="0.25" max="2" step="0.25" value="1"></div>
<div class="row"><label for="loop">循环当前动作</label><input id="loop" type="checkbox" checked></div>
<div class="field"><label for="expression">表情</label><select id="expression"><option value="">原始表情</option></select></div>
<div class="row"><label for="wireframe">显示三角网格</label><input id="wireframe" type="checkbox"></div>
<section><div class="section-label">参数 / PARAMETERS</div><div class="sub" style="margin-bottom:12px">调整参数会暂停动作，复位可恢复待机</div><div id="parameters" class="fields"></div><details><summary id="advanced-title">更多参数</summary><div id="advanced" class="fields"></div></details></section>
<div class="row"><span>背景</span><div class="swatches"><button class="swatch active" data-bg="light" style="background:#e7edf8" aria-label="浅色背景"></button><button class="swatch" data-bg="dark" style="background:#252c3e" aria-label="深色背景"></button><button class="swatch" data-bg="checker" style="background:repeating-conic-gradient(#e0e5ee 0% 25%,#f2f4f8 0% 50%) 50%/10px 10px" aria-label="棋盘背景"></button></div></div>
<div class="note" id="meta">模型正在加载…</div></aside></div>
<footer><span>模型：JackCui / 大肥鱼 · Cubism Core</span><a href="dafeiyu/NOTICE.txt" target="_blank" rel="noopener">素材与运行库来源</a></footer>
</main>
<script src="/vendor/live2d/live2dcubismcore.min.js"></script>
<script src="/vendor/live2d/pixi.min.js"></script>
<script src="/vendor/live2d/cubism4.min.js"></script>
<script src="live2d-motion.js"></script>
<script src="live2d-player.js"></script>
</body></html>
