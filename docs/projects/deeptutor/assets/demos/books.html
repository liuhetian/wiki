<!--
  Goal      Book 不是一口气写完：先给一份书脊让你改，底部先报「几章、多少字、要生成几分钟」，确认后一章一章编，
            第一章编好就能读；知识库改了，横幅告诉你哪页过期了
  Surface   /learning/books/[bookId] · app/(workspace)/learning/books/BooksRoute.tsx
  Sources   app/(workspace)/learning/books/components/SpineEditor.tsx 60-110（生成范围按钮、内容类型选项）、
              292-470（书脊头部、章节卡、学习目标、虚线「添加章节」）、470-600（底部：几章、约多少字、预计几分钟、
              全部内容类型、生成全部 / 只生成第一章、确认主线、底下一行说明）；
            SpineEditor.tsx 213-228、430-446（估算：按章累加，字数 Math.round(/100)*100，分钟 Math.ceil(秒/60)）；
            components/BookSidebar.tsx 20-50（章节状态 → 活动标记）、141-311（232px 侧栏、全部书籍、书名、导出、重建、章节列表）；
            components/activity/ActivityMark.tsx（12px：编写中是小球，已写好是实心蓝圈，排队是空心灰圈）；
            components/BookGenerationActivity.tsx 33、164-200（46px 进度条、{{done}}/{{total}} 章、暂停生成）；
            lib/book-activity.ts 420-436（「正在编写《标题》」）；
            components/PageReader.tsx 458-500（页头：标题 26px、学习目标、页面状态标签、收藏）、
              548-600（「正在规划内容块…」「正在编译页面…」、正文 max-w-[78ch] gap-6）；
            components/blocks/TextBlock.tsx、CalloutBlock.tsx 12-62（key_idea 琥珀色左竖线）、
              ConceptGraphBlock.tsx 84-110（概念图 · N 个概念 · M 条关系，正文是 mermaid）、QuizBlock.tsx 84-290（快速检查）；
            components/BookHealthBanner.tsx 182-350（琥珀横幅：知识库变了、几页可能过期、重新编译第一个过期页面、标记为已查看）；
            components/Mermaid.tsx 25-63（theme base，themeVariables 取主题色，htmlLabels false，curve basis）
  Layout    第一幕：Shell（个性化学习）→ 书脊编辑器；第二幕：Shell → BookSidebar 232px | 进度条 + 横幅 + 页面阅读器
  Data      DT.DATA.spine、book、example
  Autoplay  书脊（底部估算 5 章 · 约 15600 字 · 预计生成 16 分钟）→ 滚到第 3 章补一条目标 → 确认主线 → 概览已就绪、第 1 章编写中 →
            规划、编译、正文逐块出来（文本、提示、概念图、快速检查）→ 第 1 章写好、第 2 章开始 →
            显示答案 → 知识库漂移横幅，一圈约 27s
  Height    640
  Deviations 估算照 book/estimate.py 实跑的 standard 深度数（sim/out/book-estimate.json）按前端加法算出，不是现场请求；
            书里的正文、概念图、题是本 demo 写的；
            进度条的展开历史、书内聊天侧栏不画
  Checks    书脊、侧栏、进度条、阅读器、横幅文案与语言包一致；mermaid 只在 useEffect 里调
-->

/* SpineEditor.tsx CONTENT_TYPE_OPTIONS 里用到的四种 */
const TYPES = {
  theory: ["Theory", "Long-form explanation with diagrams + flash cards + a quiz."],
  derivation: ["Derivation", "Step-by-step derivation, often with animation + verifying code."],

/* 演示自拟的书 */
const BOOK_TITLE = "假设检验：从直觉到判断";
const KINDS = ["concept", "theory", "derivation", "theory", "practice"];
const SUMMARIES = ["从灌装线的一个问题说起", "两种错误各自的代价", "例 8.3 从头算一遍", "条件概率和三种误读", "多大的样本才够"];
const SPINE = DATA.spine.map((c, i) => Object.assign({}, c, { kind: KINDS[i], summary: SUMMARIES[i] }));
const EXTRA_OBJ = "对比 t 检验和 z 检验的适用条件";
/* 估算：book/estimate.py 的 chapter_basis 给每种内容类型一章的字数和秒数（standard 深度），
   前端 SpineEditor.tsx 213-228 按章累加，字数取整到百、分钟向上取整；只看内容类型，和学习目标条数无关。
   下面五个数取自实跑原件 sim/out/book-estimate.json 的 basis.standard */
const BASIS = {
  theory: { words: 3600, seconds: 210 },
  derivation: { words: 3600, seconds: 195 },
  practice: { words: 2200, seconds: 165 },
  concept: { words: 2600, seconds: 165 },
};
const estimate = () => {
  let words = 0;
  let seconds = 0;
  for (const c of SPINE) {
    words += BASIS[c.kind].words;
    seconds += BASIS[c.kind].seconds;
  }
  return { words: Math.round(words / 100) * 100, minutes: Math.ceil(seconds / 60) };
};

const CH1 = SPINE[0];
const EX = DATA.example;
const BLOCK_TEXT_1 =
  "灌装线标称每瓶 50 毫升，抽检 25 瓶，均值是 52.3。多出来的 2.3 毫升，可能是机器真的偏了，也可能只是这一批抽得不巧。" +
  "**假设检验**要回答的就是：差距大到什么程度，才不再像是运气。";
const BLOCK_TEXT_2 =
  "做法是先立一个靶子。原假设 $H_0$：μ = 50，机器没偏；备择假设 $H_1$：μ ≠ 50。然后在「$H_0$ 为真」的前提下，看这批数据有多罕见——" +
  "罕见到一定程度，就拒绝 $H_0$。";
const CALLOUT = { label: "核心思想", body: "检验从不证明 H0 为真，只问手上的数据够不够推翻它。" };
const GRAPH = [
  "flowchart LR",
  "  A[原假设 H0] --> B[检验统计量 t]",
  "  B --> C[p 值]",
  "  D[显著性水平 α] --> E{p 小于 α？}",
  "  C --> E",
  "  E -->|是| F[拒绝 H0]",
  "  E -->|否| G[不能拒绝 H0]",
].join("\n");
const QUIZ = {
  stem: "例子里的原假设 H0 是哪一个？",
  difficulty: "easy",
  options: [["A", "μ = 52.3"], ["B", "μ = 50"], ["C", "μ ≠ 50"], ["D", "x̄ = 50"]],
  answer: "B",
};

const initial = {

/* ActivityMark：编写中小球；已就绪实心蓝圈；排队空心灰圈 */

          <span class="bk-scope"><span class="is-on">${T["Generate all chapters"]}</span><span>${T["First chapter only"]}</span></span>

let graphSeq = 0;
function ConceptGraph() {
  const ref = useRef(null);
  const [ready, setReady] = useState(false);
  useEffect(() => {
    const mermaid = window.mermaid;
    if (!mermaid || !ref.current) return undefined;
    let alive = true;
    const css = getComputedStyle(document.documentElement);
    const v = (name, fallback) => (css.getPropertyValue(name) || fallback).trim();
    mermaid.initialize({
      startOnLoad: false,
      theme: "base",
      securityLevel: "strict",
      fontFamily: getComputedStyle(document.body).fontFamily,
      flowchart: { useMaxWidth: true, htmlLabels: false, curve: "basis" },
      themeVariables: {
        primaryColor: v("--card", "#ffffff"),
        primaryTextColor: v("--foreground", "#0d0d0d"),
        primaryBorderColor: v("--border", "#e5e5e5"),
        lineColor: v("--muted-foreground", "#6e6e6e"),
        secondaryColor: v("--muted", "#f2f2f2"),
        tertiaryColor: v("--background", "#ffffff"),
        textColor: v("--foreground", "#0d0d0d"),
        mainBkg: v("--card", "#ffffff"),
      },
    });
    graphSeq += 1;
    mermaid.render("bk-graph-" + graphSeq, GRAPH).then(({ svg }) => {
      if (alive && ref.current) {
        ref.current.innerHTML = svg;
        setReady(true);
      }
    });
    return () => {
      alive = false;
    };
  }, []);
  return html`<figure class="bk-graph animate-fade-in">
    <header class="bk-graph__head"><${Icon} name="compass" size=${14} /><span>${tr("Concept map · {{concepts}} concepts · {{relations}} relations", { concepts: 7, relations: 6 })}</span></header>
    <div class="bk-graph__svg" ref=${ref}>${ready ? null : html`<span class="bk-graph__pending">${T["Compiling page…"]}</span>`}</div>
  </figure>`;
}

    <div class="bk-q">

        <div class="row" style=${{ alignItems: "flex-start", gap: 8 }}><span>1.</span><span>${QUIZ.stem}</span></div>

      </div>
      <div class="bk-opts">
        ${QUIZ.options.map(([k, label]) => {

          return html`<div key=${k} class=${cx("bk-opt", { "is-correct": correct })}>
            <span class="bk-opt__key">${k}.</span>
            <span class="grow min0">${label}</span>

    </div>
  </section>`;
}

      <${Reader} s=${s} />

}

function render(s) {

    ${s.phase === "spine" ? html`<${SpineEditor} s=${s} />` : html`<${BookView} s=${s} />`}

}

DT.run({ T, initial, steps, render, options: { loopDelay: 2200 } });
