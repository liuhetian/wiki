const { html, Icon, cx, DATA, ActivityHeader, ActivityRow, Prose } = DT;

DT.ICONS["list-tree"] = '<path d="M8 5h13M13 12h8M13 19h8M3 10a2 2 0 0 0 2 2h3"/><path d="M3 5v12a2 2 0 0 0 2 2h3"/>';
DT.ICONS["panel-left-close"] = '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18M16 15l-3-3 3-3"/>';
DT.ICONS["panel-right-close"] = '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18M8 9l3 3-3 3"/>';
DT.ICONS["message-square-quote"] = '<path d="M14 14a2 2 0 0 0 2-2V8h-2"/><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/><path d="M8 14a2 2 0 0 0 2-2V8H8"/>';

const T = {
  "Back to folder": "返回资料组",
  "Collapse contents": "收起目录",
  "Add material": "添加资料",
  "Read aloud": "朗读",
  "Quiz me on this page": "就这一页测一测",
  "Exit learning mode": "退出学习模式",
  "New conversation": "新对话",
  "Reading companion": "阅读伙伴",
  "Focus reading companion": "对话专注模式",
  "Contents": "目录",
  "Annotations": "标注",
  "Citations": "引用",
  "Close contents": "关闭目录",
  "Search materials and contents": "搜索资料和目录",
  "{{count}} pages": "{{count}} 页",
  "{{unit}} {{n}} / {{total}}": "第 {{n}} {{unit}} / 共 {{total}}",
  "Page": "页",
  "AI": "AI",
  "Back": "上一步",
  "More": "更多",
  "Read and ask as you go": "边读边问",
  "Select any passage to ask about it, explain it or translate it — or just ask below. Answers point back to the page they come from.":
    "在文档里选中任意一段，就地提问、解释或翻译；也可以直接在下面问。回答会标出出处页码。",
  "Ask about this material…": "就这份资料提问…",
  "{{name}} Exploring…": "{{name}} 探索中…",
  "Tool Calling…": "调用工具中…",
  "DeepTutor responded.": "已完成",
  "{{count}} tool calls": "{{count}} 次工具调用",
  "Working on it…": "正在处理…",
  "Ask a follow-up": "继续追问",
  "Dismiss": "关闭",
  "Copy": "复制",
  "Regenerate": "重新生成",
};
const tt = (key, vars) => T[key].replace(/\{\{(\w+)\}\}/g, (_, k) => String(vars[k]));

const BOOK = DATA.book;
const FIRST = 231;
const LAST = 250;
const PAGES = [];
for (let p = FIRST; p <= LAST; p++) PAGES.push(p);
const sectionOf = (page) => BOOK.sections.filter((s) => s.page <= page).slice(-1)[0];
const quoteOf = (id) => {
  const page = Number(id.split("-")[0]);
  return DATA.pages[page].find((x) => x.id === id).text;
};

/* 共用的 Prose 不排下标，H_0 先换成 H₀，相当于上游 KaTeX 渲染后的样子 */
const ANSWER = DATA.answer.replace(/H_0/g, "H₀");

/* 上游 lib/reading-api.ts ANNOTATION_SWATCH.yellow */
const SWATCH_YELLOW = "#facd5a";

const QUIZ = {
  quote: quoteOf("236-3"),
  prompt: "显著性水平 α 是在什么时候给定的？",
  options: ["看到样本、算出 p 值之后", "抽样之前，与这一个样本无关", "等结论出来再按需要调整"],
  answer: 1,
  verdict: "答对了：α 在抽样之前就已给定。",
};

const initial = {
  page: 246,
  flash: null,
  marks: [],
  nav: "contents",
  draft: "",
  focus: false,
  user: null,
  turn: null,
  answer: "",
  hotChip: null,
  card: null,
  pick: null,
  press: null,
  send: "idle",
};

const rows = (...states) =>
  ["Search Material", "Read Material", "Reader Goto", "Reader Annotate"]
    .slice(0, states.length)
    .map((title, i) => ({ title, state: states[i] }));

const steps = [
  { at: 120, scroll: { sel: "#rd-scroll", to: '[data-page="246"]', block: "start", offset: 4, behavior: "instant" } },
  { label: "reading-246" },
  { at: 1400, set: { focus: true } },
  { at: 300, type: { key: "draft", text: DATA.question, cps: 14 } },
  { at: 300, set: { send: "ready" } },
  { at: 450, set: (s) => ({ user: s.draft, draft: "", focus: false, send: "streaming", turn: { phase: "running", rows: rows("running") } }) },
  { at: 1300, set: { turn: { phase: "running", rows: rows("done", "running") } } },
  { at: 1100, set: { turn: { phase: "running", rows: rows("done", "done", "running") }, page: 248, flash: { id: "248-2", n: 1 } } },
  { at: 0, scroll: { sel: "#rd-scroll", to: '[data-page="248"]', block: "start", offset: 4, behavior: "instant" } },
  { label: "goto-248" },
  { at: 1400, set: { turn: { phase: "running", rows: rows("done", "done", "done", "running") } } },
  { at: 700, set: { turn: { phase: "running", rows: rows("done", "done", "done", "done") }, marks: ["248-1"], nav: "notes" } },
  { label: "annotated" },
  { at: 500, stream: { key: "answer", text: ANSWER, chunk: [1, 3], ms: [20, 44] } },
  { at: 200, set: { turn: { phase: "settled", rows: rows("done", "done", "done", "done"), duration: "7s" }, send: "idle" } },
  { at: 60, scroll: { sel: "#rd-cscroll", bottom: true, ms: 360 } },
  { at: 1500, set: { hotChip: 236 } },
  { at: 260, set: { page: 236, flash: { id: "236-3", n: 2 }, nav: "contents" } },
  { at: 0, scroll: { sel: "#rd-scroll", to: '[data-page="236"]', block: "start", offset: 4, behavior: "instant" } },
  { label: "chip-236" },
  { at: 2600, set: { press: "quiz", hotChip: null } },
  { at: 220, set: { press: null, card: "running" } },
  { at: 60, scroll: { sel: "#rd-cscroll", bottom: true, ms: 360 } },
  { at: 1600, set: { card: "done" } },
  { at: 60, scroll: { sel: "#rd-cscroll", bottom: true, ms: 360 } },
  { at: 1500, set: { pick: 1 } },
  { label: "quizzed" },
  { at: 3400 },
];

/* 选段插画（WorkspaceChrome.tsx SelectPassageMark） */
function SelectPassageMark() {
  const line = "color-mix(in srgb, var(--muted-foreground) 22%, transparent)";
  return html`<svg width="64" height="72" viewBox="0 0 64 72" aria-hidden="true" style=${{ overflow: "visible" }}>
    <rect x="8.5" y="4.5" width="47" height="63" rx="7" fill="var(--card)" stroke="var(--border)" />
    <rect x="17" y="17" width="30" height="3" rx="1.5" fill=${line} />
    <rect x="17" y="25" width="26" height="3" rx="1.5" fill=${line} />
    <rect x="14.5" y="30.5" width="30" height="10" rx="2.5" fill="color-mix(in srgb, var(--primary) 16%, transparent)" />
    <rect x="17" y="34" width="25" height="3" rx="1.5" fill="var(--primary)" />
    <path d="M44.5 29v13" stroke-width="1.5" stroke-linecap="round" stroke="var(--primary)" />
    <rect x="17" y="46" width="30" height="3" rx="1.5" fill=${line} />
    <rect x="17" y="54" width="18" height="3" rx="1.5" fill=${line} />
  </svg>`;
}

function PageCard({ page, s }) {
  const paras = DATA.pages[page];
  return html`<div class="rd-page" data-reader-unit=${page} data-page=${page}>
    ${paras
      ? html`<div class="rd-paper">
          <div class="rd-runhead"><span>第 ${BOOK.chapter.no} 章　${BOOK.chapter.title}</span><span>${sectionOf(page).id}　${sectionOf(page).title}</span></div>
          ${paras.map((p) => {
            const flashing = s.flash && s.flash.id === p.id;
            const marked = s.marks.includes(p.id);
            const inner = flashing
              ? html`<span class="dt-reader-flash" key=${"f" + s.flash.n}>${p.text}</span>`
              : p.text;
            return html`<p key=${p.id} class=${cx("rd-para", { "is-heading": p.heading })} data-para=${p.id}>
              ${marked ? html`<span class="rd-mark">${inner}<span class="rd-mark__dot"></span></span>` : inner}
            </p>`;
          })}
          <div class="rd-folio">${page}</div>
        </div>`
      : html`<div class="rd-page__ghost">${page}</div>`}
  </div>`;
}

function Navigator({ s }) {
  const current = sectionOf(s.page);
  const notes = s.nav === "notes";
  return html`<aside class="rd-nav">
    <div class="rd-nav__head">
      <div class="row min0 grow" role="tablist" style=${{ gap: 2 }}>
        <span class=${cx("rd-tab", { "is-on": !notes })}><${Icon} name="list-tree" size=${12} /><span class="truncate">${T["Contents"]}</span></span>
        <span class=${cx("rd-tab", { "is-on": notes })}>
          <${Icon} name="highlighter" size=${12} /><span class="truncate">${T["Annotations"]}</span>
          ${s.marks.length ? html`<span class="rd-tab__count">${s.marks.length}</span>` : null}
        </span>
      </div>
      <span class="rd-hbtn" title=${T["Close contents"]}><${Icon} name="x" size=${13} /></span>
    </div>
    ${notes
      ? html`<div class="col min0 grow">
          <div class="rd-anno-tabs">
            <span class="rd-tab is-on"><${Icon} name="highlighter" size=${12} />${T["Annotations"]}</span>
            <span class="rd-tab"><${Icon} name="bookmark" size=${12} />${T["Citations"]}</span>
          </div>
          <div class="rd-anno-list">
            <section>
              <h4 class="rd-anno-group">${T["Page"]} 248</h4>
              ${s.marks.map(
                (id) => html`<div key=${id} class="rd-anno is-on animate-fade-in">
                  <span class="rd-anno__swatch" style=${{ background: SWATCH_YELLOW }}></span>
                  <p class="rd-anno__quote">${quoteOf(id)}</p>
                  <div class="row" style=${{ marginTop: 4, gap: 6, paddingLeft: 6 }}>
                    <span class="rd-ai"><${Icon} name="bot" size=${9} />${T["AI"]}</span>
                  </div>
                </div>`
              )}
            </section>
          </div>
        </div>`
      : html`<div class="col min0 grow">
          <label class="rd-search"><${Icon} name="search" size=${12} />${T["Search materials and contents"]}</label>
          <div class="rd-nav__list">
            <div class="rd-mat">
              <span class="rd-mat__btn"><${Icon} name="file-text" size=${12} /><span class="clamp2">${BOOK.file}</span></span>
              <span class="rd-hbtn" style=${{ marginRight: 4, height: 22, width: 22 }}><${Icon} name="chevron-down" size=${11} /></span>
            </div>
            <div class="rd-branch">
              ${BOOK.sections.map(
                (sec) => html`<div key=${sec.id} class=${cx("rd-row", { "is-on": sec.id === current.id })}>
                  <span class="rd-row__loc">${sec.page}</span>
                  <span class="rd-row__text">${sec.id}　${sec.title}</span>
                </div>`
              )}
            </div>
          </div>
          <div class="rd-nav__foot">${tt("{{count}} pages", { count: BOOK.pages })}</div>
        </div>`}
  </aside>`;
}

function Turn({ s }) {
  const t = s.turn;
  const running = t.phase === "running";
  const toolBusy = t.rows.some((r) => r.state === "running");
  return html`<div class="rd-turn animate-fade-in" role="article">
    <${ActivityHeader}
      label=${running ? (toolBusy ? T["Tool Calling…"] : tt("{{name}} Exploring…", { name: "DeepTutor" })) : T["DeepTutor responded."]}
      settled=${!running}
      duration=${running ? null : t.duration}
      summary=${running ? null : tt("{{count}} tool calls", { count: t.rows.length })}
      expandable=${!running}
    />
    ${running ? html`<div class="rd-rows">${t.rows.map((r) => html`<${ActivityRow} key=${r.title} state=${r.state} title=${r.title} breathing=${r.state === "running"} />`)}</div>` : null}
    ${s.answer
      ? html`<div class=${s.hotChip ? "rd-hot-" + s.hotChip : ""}><${Prose} text=${s.answer} caret=${running} /></div>`
      : null}
    ${!running
      ? html`<div class="rd-actions">
          <span title=${T["Copy"]}><${Icon} name="copy" size=${15} strokeWidth=${1.5} /></span>
          <span title=${T["Regenerate"]}><${Icon} name="refresh-cw" size=${15} strokeWidth=${1.5} /></span>
        </div>`
      : null}
  </div>`;
}

function ActionCard({ s }) {
  return html`<article class="rd-card">
    <header class="rd-card__head">
      <${Icon} name="sparkles" size=${12} style=${{ color: "var(--primary)" }} />
      <h3 class="rd-card__title">${T["Quiz me on this page"]} · ${T["Page"]} 236</h3>
      <span class="rd-card__x" title=${T["Dismiss"]}><${Icon} name="x" size=${13} /></span>
    </header>
    <blockquote class="rd-card__quote">${QUIZ.quote}</blockquote>
    <div class="rd-card__body">
      ${s.card === "running"
        ? html`<div role="status">
            <p class="rd-card__busy"><${Icon} name="loader-2" size=${12} class="animate-spin" />${T["Working on it…"]}</p>
            <div class="rd-card__line" style=${{ width: "92%" }}></div>
            <div class="rd-card__line" style=${{ width: "67%" }}></div>
          </div>`
        : html`<section class="animate-fade-in">
            <fieldset style=${{ margin: 0, padding: 0, border: 0 }}>
              <legend style=${{ fontWeight: 500 }}>${QUIZ.prompt}</legend>
              <div class="rd-q__opts">
                ${QUIZ.options.map((o, i) => html`<span key=${i} class=${cx("rd-q__opt", { "is-on": s.pick === i })}>${o}</span>`)}
              </div>
              ${s.pick !== null ? html`<p class="rd-q__verdict animate-fade-in">${QUIZ.verdict}</p>` : null}
            </fieldset>
          </section>`}
    </div>
    ${s.card === "done"
      ? html`<footer class="rd-card__foot"><span class="rd-card__btn"><${Icon} name="message-square-quote" size=${13} />${T["Ask a follow-up"]}</span></footer>`
      : null}
  </article>`;
}

function render(s) {
  const streaming = s.send === "streaming";
  return html`<main class="rd-main" data-reading-workspace="" data-learning="true">
    <header class="rd-head">
      <span class="rd-hbtn" title=${T["Back to folder"]}><${Icon} name="arrow-left" size=${14} /></span>
      <span class="rd-hbtn is-on" title=${T["Collapse contents"]}><${Icon} name="panel-left-close" size=${14} /></span>
      <span class="rd-title">第 8 章　${BOOK.chapter.title}</span>
      <span class="rd-hbtn" title=${T["Add material"]}><${Icon} name="plus" size=${14} /></span>
      <div class="row" style=${{ marginLeft: "auto", gap: 2 }}>
        <span class="rd-hbtn" title=${T["Read aloud"]}><${Icon} name="volume-2" size=${14} /></span>
        <span class=${cx("rd-hbtn", { "is-press dt-press": s.press === "quiz" })} title=${T["Quiz me on this page"]}><${Icon} name="list-checks" size=${14} /></span>
        <span class="rd-hbtn is-on" title=${T["Exit learning mode"]}><${Icon} name="minimize-2" size=${14} /></span>
        <span class="rd-hbtn"><${Icon} name="ellipsis" size=${14} /></span>
        <span class="rd-hbtn" title=${T["New conversation"]}><${Icon} name="square-pen" size=${14} /></span>
        <span class="rd-hbtn is-on" title=${T["Reading companion"]}><${Icon} name="panel-right-close" size=${14} /></span>
        <span class="rd-hbtn" title=${T["Focus reading companion"]}><${Icon} name="maximize-2" size=${14} /></span>
      </div>
    </header>

    <div class="rd-grid">
      <${Navigator} s=${s} />

      <section class="rd-center">
        <header class="rd-reader-head">
          <${Icon} name="file-text" size=${14} style=${{ color: "var(--muted-foreground)" }} />
          <span class="rd-reader-title">${BOOK.title}</span>
          ${s.page !== 246 ? html`<span class="rd-rbtn" title=${T["Back"]}><${Icon} name="arrow-left" size=${14} /></span>` : null}
          <span class="rd-pageno">${tt("{{unit}} {{n}} / {{total}}", { unit: T["Page"], n: s.page, total: BOOK.pages })}</span>
          <span class="rd-rbtn"><${Icon} name="bookmark" size=${14} /></span>
          <span class="rd-rbtn" title=${T["More"]}><${Icon} name="ellipsis" size=${14} /></span>
        </header>
        <div class="rd-scroll dt-reader-scroll" id="rd-scroll" data-dt-scroll>
          <div class="rd-pages">${PAGES.map((p) => html`<${PageCard} key=${p} page=${p} s=${s} />`)}</div>
        </div>
      </section>

      <div class="rd-sep" role="separator"></div>

      <aside class="rd-companion">
        <div class="rd-c-scroll" id="rd-cscroll" data-dt-scroll data-chat-scroll-root="true">
          ${s.user
            ? html`<div class="rd-turns">
                <div class="rd-user animate-fade-in"><div class="dt-user-bubble">${s.user}</div></div>
                ${s.turn ? html`<${Turn} s=${s} />` : null}
              </div>`
            : html`<div class="rd-welcome">
                <${SelectPassageMark} />
                <p class="rd-welcome__title">${T["Read and ask as you go"]}</p>
                <p class="rd-welcome__body">${T["Select any passage to ask about it, explain it or translate it — or just ask below. Answers point back to the page they come from."]}</p>
              </div>`}
          ${s.card ? html`<${ActionCard} s=${s} />` : null}
        </div>
        <div class="rd-c-composer">
          <div class="dt-composer">
            <div class=${cx("rd-input", { "is-empty": !s.draft, "dt-caret": s.focus })}>${s.draft || (s.focus ? "" : T["Ask about this material…"])}</div>
            <div class="rd-toolbar">
              <span class="rd-tbtn" style=${{ marginRight: "auto" }}><${Icon} name="plus" size=${16} strokeWidth=${1.8} /></span>
              <span class="rd-tbtn"><${Icon} name="sparkles" size=${16} strokeWidth=${1.7} /><${Icon} name="chevron-down" size=${13} /></span>
              <span class="rd-mic"><${Icon} name="mic" size=${16} strokeWidth=${1.9} /></span>
              <span class=${cx("rd-send", { "is-ready": s.send === "ready" || (s.draft && !streaming), "is-streaming": streaming })}>
                ${streaming ? html`<span class="rd-send__ring"></span>` : null}
                ${streaming
                  ? html`<${Icon} name="square" size=${10} strokeWidth=${2.6} style=${{ fill: "currentColor" }} />`
                  : html`<${Icon} name="arrow-up" size=${16} strokeWidth=${2.5} />`}
              </span>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>`;
}

DT.run({ T, initial, steps, render });
</script>
</body>
</html>
