  ["video.invidious", "video_learning", "Invidious", "not_selected", "video_provider_not_configured"],
  ["runtime.coordination.memory", "runtime", "In-memory turn coordination", "enabled_verified", ""],
  ["runtime.coordination.redis", "runtime", "Redis turn coordination", "not_selected", "redis_not_configured"],
].map(([id, section, label, state, detail, required = false, model = "", provider = ""]) => ({ id, section, label, state, detail, required, model, provider }));

const SECTION_ORDER = ["catalog", "knowledge", "document_parsing", "tools", "visualizers", "video_learning", "runtime"];
const USABLE = new Set(["enabled_verified", "available_disabled"]);
const severityOf = (r) => (r.required && !USABLE.has(r.state) ? "blocker" : r.state === "misconfigured" ? "warning" : null);
const prominent = (r) => r.state === "enabled_verified" || severityOf(r) !== null;
const detailOf = (r) => (r.state === "enabled_verified" || !r.detail ? "" : tr("readiness.detail." + r.detail));

function rowsFor(s) {
  return ROWS.map((r) =>
    r.state !== "KB"
      ? r
      : Object.assign({}, r, s.kbReady
          ? { state: "enabled_verified", detail: "" }
          : { state: "misconfigured", detail: "knowledge_base_needs_reindex" })
  );
}

const initial = { loaded: false, loading: true, kbReady: false, fold: null, flash: false, pressed: false };

const steps = [
  { at: 1300, set: { loaded: true, loading: false } },
  { label: "loaded" },
  { at: 1500, scroll: { sel: "#st-scroll", to: "#readiness", ms: 520 } },
  { at: 2300, scroll: { sel: "#st-scroll", to: '[data-section="catalog"]', offset: 8, ms: 520 } },
  { at: 1100, set: { fold: "catalog" } },
  { label: "folded-open" },
  { at: 2400, set: { fold: null } },
  { at: 300, scroll: { sel: "#st-scroll", to: "#readiness", ms: 520 } },
  { at: 1000, set: { pressed: true } },
  { at: 160, set: { pressed: false, loading: true } },
  { at: 1300, set: { loading: false, kbReady: true, flash: true } },
  { label: "refreshed" },
  { at: 2600, scroll: { sel: "#st-scroll", to: '[data-section="knowledge"]', offset: 8, ms: 520 } },
  { at: 2400, set: { flash: false } },
];

function Row({ r, s }) {
  const sev = severityOf(r);
  const detail = detailOf(r);
  return html`<li class=${cx("rd__row", { rd__flash: s.flash && r.section === "knowledge" })}>
    <span class="row" style=${{ flexWrap: "wrap", alignItems: "baseline", gap: "2px 8px", minWidth: 0 }}>
      <span class="rd__label">${tr(r.label)}</span>
      ${detail ? html`<span class="rd__detail">${detail}</span>` : null}
    </span>
    <span class="row" style=${{ gap: 8, minWidth: 0 }}>
      ${r.model
        ? html`<span class="rd__model">${r.provider ? html`<span class="rd__prov">${r.provider}</span>` : null}<span>${r.model}</span></span>`
        : null}
      <span class=${cx("rd__state", "tone-" + (sev || r.state))}>${tr("readiness.state." + r.state)}</span>
    </span>
  </li>`;
}

function Group({ section, rows, s }) {
  const shown = rows.filter(prominent);
  const folded = rows.filter((r) => !prominent(r));
  const ready = rows.filter((r) => r.state === "enabled_verified").length;
  const open = s.fold === section;
  return html`<div class="rd__group rd__appear" data-section=${section}>
    <div class="rd__ghead">
      <h3 class="rd__h3" style=${{ padding: 0 }}>${tr("readiness.section." + section)}</h3>
      ${ready > 0 ? html`<span class="rd__gcount">${tr("readiness.group.ready", { n: ready })}</span>` : null}
    </div>
    <ul class="rd__rows">${shown.map((r) => html`<${Row} key=${r.id} r=${r} s=${s} />`)}</ul>
    ${folded.length
      ? html`<div>
          <div class=${cx("rd__fold", { "is-open": open })}>${tr("readiness.group.folded", { n: folded.length })}</div>
          ${open ? html`<ul class="rd__rows rd__appear" style=${{ paddingBottom: 4 }}>${folded.map((r) => html`<${Row} key=${r.id} r=${r} s=${s} />`)}</ul>` : null}
        </div>`
      : null}
  </div>`;
}

function Panel({ s }) {
  const rows = rowsFor(s);
  const count = (st) => rows.filter((r) => r.state === st).length;
  const summary = s.loaded
    ? [
        tr("readiness.summary.ready", { n: count("enabled_verified") }),
        count("available_disabled") > 0 && tr("readiness.summary.available", { n: count("available_disabled") }),
        count("unavailable") + count("not_selected") > 0 && tr("readiness.summary.idle", { n: count("unavailable") + count("not_selected") }),
      ].filter(Boolean).join(" · ")
    : tr("readiness.blurb");
  const attention = rows.filter(severityOf);
  return html`<section class="rd" id="readiness">
    <header class="rd__head">
      <div class="min0">
        <h2 class="rd__title">${tr("readiness.title")}</h2>
        <p class="rd__summary">${summary}</p>
      </div>
      <button type="button" class=${cx("rd__refresh", { "dt-press": s.pressed })} disabled=${s.loading}>
        <${Icon} name=${s.loading ? "loader-2" : "refresh-ccw"} size=${12} class=${s.loading ? "animate-spin" : ""} />
        ${tr("readiness.refresh")}
      </button>
    </header>
    <div class="rd__body">
      ${!s.loaded
        ? html`<p class="rd__loading"><${Icon} name="loader-2" size=${14} class="animate-spin" />${tr("readiness.loading")}</p>`
        : html`<div>
            <h3 class="rd__h3">${tr("readiness.attention.title")}</h3>
            ${attention.length === 0
              ? html`<p class="rd__none rd__appear" key="none"><${Icon} name="check" size=${14} />${tr("readiness.attention.none")}</p>`
              : html`<ul class="rd__list">
                  ${attention.map(
                    (r) => html`<li key=${r.id} class="rd__att">
                      <span class="min0"><span class=${"tone-" + severityOf(r)}>${tr(r.label)}</span><span class="muted"> · ${detailOf(r)}</span></span>
                      <span class="rd__open">${tr("readiness.attention.open")}<${Icon} name="arrow-up-right" size=${12} /></span>
                    </li>`
                  )}
                </ul>`}
            <div>
              ${SECTION_ORDER.map((sec) => html`<${Group} key=${sec} section=${sec} rows=${rows.filter((r) => r.section === sec)} s=${s} />`)}
            </div>
          </div>`}
    </div>
  </section>`;
}

function render(s) {
  return html`<div class="st-shell">
    <aside class="st-aside">
      <div style=${{ padding: "16px 10px 6px" }}>
        <div class="st-back"><${Icon} name="arrow-left" size=${16} strokeWidth=${1.7} />${T["Back to app"]}</div>
      </div>
      <div class="st-search"><${Icon} name="search" size=${14} strokeWidth=${1.8} /><div>${T["Search settings"]}</div></div>
      <nav class="st-nav" id="st-nav" data-dt-scroll>
        ${NAV.map(
          (g) => html`<div key=${g.group} style=${{ marginBottom: 2 }}>
            <p class="st-group">${g.group}</p>
            ${g.pages.map(
              ([label, icon, active]) => html`<div key=${label} class=${cx("st-item", { "is-active": active })} data-active=${active ? "true" : null}>
                <${Icon} name=${icon} size=${15} strokeWidth=${1.8} />
                <span>${label}</span>
              </div>`
            )}
          </div>`
        )}
      </nav>
    </aside>
    <main class="st-main">
      <div class="st-topbar">
        <div class="st-back"><${Icon} name="arrow-left" size=${16} strokeWidth=${1.7} />${T["Back to app"]}</div>
        <span class="muted" style=${{ padding: 8 }}><${Icon} name="menu" size=${18} /></span>
      </div>
      <div class="st-scroll" id="st-scroll" data-dt-scroll>
        <div class="st-container dt-page-container">
          <header class="st-header">
            <h1 class="dt-page-title st-title">${T["Runtime status"]}</h1>
            <p class="st-desc">${T["Check configured services and resolve connection problems."]}</p>
          </header>
          <section class="st-strip">
            <div class="st-strip__item">
              <span class="st-strip__dot"></span>
              <div class="row" style=${{ alignItems: "baseline", gap: 8 }}>
                <span class="st-strip__name">${T["Backend"]}</span><span class="st-strip__val">${T["Online"]}</span>
              </div>
            </div>
            <div class="row" style=${{ gap: 8 }}>
              <span class="st-strip__name" style=${{ letterSpacing: 0 }}>${T["Turn runtime"]}</span>
              <${DT.StatusChip} tone="success">${T["Healthy"]}<//>
            </div>
            <div class="st-strip__item">
              <span class="st-strip__dot"></span>
              <div class="row" style=${{ alignItems: "baseline", gap: 8 }}>
                <span class="st-strip__name">${T["System memory"]}</span>
                <span class="st-strip__val">${tr("{{used}} · {{percent}}% of {{total}}", { used: "1.8 GB", percent: 23, total: "7.8 GB" })}</span>
              </div>
            </div>
          </section>
          <${Panel} s=${s} />
        </div>
      </div>
    </main>
  </div>`;
}

DT.run({
  T,
  initial,
  steps: [{ scroll: { sel: "#st-nav", to: '[data-active="true"]', block: "center", behavior: "instant" } }].concat(steps),
  render,
});
</script>
</body>
</html>
