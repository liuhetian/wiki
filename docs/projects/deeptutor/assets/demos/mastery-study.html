const T = {

const tt = (key, vars) => T[key].replace(/\{\{(\w+)\}\}/g, (_, k) => String(vars[k]));

const STATUS = { mastered: "mastered", in_progress: "learning", not_started: "new" };
const MODULES = DATA.mastery.modules.map((m) => ({
  id: m.id,
  name: m.title,
  points: m.points.map((p) => ({ id: p.id, name: p.title, status: p.id === "m2-p1" ? "mastered" : STATUS[p.status] })),
}));
const ALL = MODULES.flatMap((m) => m.points);
const nameOf = (id) => ALL.find((p) => p.id === id).name;

const QUESTION = {
  meta: [nameOf("m2-p2"), T["Medium"]].join(" · "),
  prompt: "例 8.3 算出双侧 p ≈ 0.0098。下面哪种说法对？",
  options: [
    { label: "A", body: "原假设为真的概率约为 0.98%" },
    { label: "B", body: "如果原假设为真，抽到至少这么极端的样本，概率约为 0.98%" },
    { label: "C", body: "备择假设为真的概率约为 99%" },
    { label: "D", body: "这次检验犯第一类错误的概率约为 0.98%" },
  ],
  correct: "B",
  explanation: "p 值是先假定 H0 为真、再算出来的条件概率，问的是这样的数据有多罕见，不是哪个假设为真的概率。",

const OPENING = "上一站「单样本 t 统计量」过了。这一站看你怎么理解 p 值，先来一道探查题。";
const NUDGE =
  "选对了。不过这一站是**概念题**，选择题打不开这道门：请你用自己的话讲一遍，p 值是在什么条件下算出来的概率？为什么它不是 $H₀$ 为真的概率？";
const EXPLAIN =
  "p 值是先假定 H0 为真，再算拿到这么极端甚至更极端数据的概率。条件就是 H0 为真，所以它没法反过来告诉我 H0 为真的概率。";
const PASS =
  "讲得很清楚：条件是 $H₀$ 为真，问的是数据有多罕见，你也说出了为什么不能反过来读。这一站过了，下一站是**拒绝域与临界值**。";

const initial = {
  picked: null,
  card: "open",
  t2: null,
  t2text: "",
  draft: "",
  focus: false,
  user: null,
  t3: null,
  t3text: "",
  mastered: [],
  just: null,
  confetti: 0,
  waypoint: "m2-p2",
  send: "idle",
  pressed: null,
};

/* ─── 彩纸：LevelUpCelebration.tsx 的参数照搬，随机数换成确定性的 ─── */
const COLORS = ["#FF4D6D", "#FF8A3D", "#FFC53D", "#3DD68C", "#38BDF8", "#7C7CFF", "#F472B6"];
const DURATION = 3200;
const TAIL_FADE = 550;
const BASE_FRAME_MS = 1000 / 60;
function seeded(seed) {
  let x = seed >>> 0;
  return () => {
    x = (x * 1664525 + 1013904223) >>> 0;
    return x / 4294967296;
  };
}
function makeParticle(c, rnd) {
  const nearField = rnd() < 0.18;
  const speed = nearField ? 6 + rnd() * 7 : 17 + Math.sqrt(rnd()) * 17;
  const angle = -Math.PI / 2 + c.aim + (rnd() - 0.5) * c.spread;
  const roll = rnd();
  const shape = roll < 0.66 ? "paper" : roll < 0.88 ? "sequin" : "streamer";
  const w = shape === "streamer" ? 3 + rnd() * 2 : 7 + rnd() * 5;
  const h = shape === "streamer" ? 14 + rnd() * 10 : shape === "sequin" ? w : w * (0.5 + rnd() * 0.35);
  return {
    x: c.x + (rnd() - 0.5) * 26, y: c.y + (rnd() - 0.5) * 14,
    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, w, h,
    color: COLORS[Math.floor(rnd() * COLORS.length)], shape,
    tilt: rnd() * Math.PI * 2, tiltSpin: (rnd() - 0.5) * 0.24,
    flip: rnd() * Math.PI * 2, flipSpeed: (shape === "sequin" ? 0.18 : 0.09) * (0.6 + rnd() * 0.9),
    wobble: rnd() * Math.PI * 2, wobbleSpeed: 0.04 + rnd() * 0.05, wobbleStrength: 0.35 + rnd() * 0.9,
    life: 1, decay: (nearField ? 0.0026 : 0.0034) + rnd() * 0.0028,
  };
}
function Confetti() {
  const ref = useRef(null);
  useEffect(() => {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const canvas = ref.current;
    const ctx = canvas && canvas.getContext("2d");
    if (!ctx) return;
    const width = window.innerWidth;
    const height = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cannons = [
      { x: width * 0.14, y: height * 0.88, aim: 0.42, spread: 0.72, count: 62, delay: 0 },
      { x: width * 0.86, y: height * 0.88, aim: -0.42, spread: 0.72, count: 62, delay: 110 },
      { x: width * 0.5, y: height * 0.94, aim: 0, spread: 1.0, count: 56, delay: 260 },
    ];
    const rnd = seeded(20261029);
    const particles = [];
    const fired = cannons.map(() => false);
    const GRAVITY = 0.42, DRAG_X = 0.968, DRAG_Y = 0.995, TERMINAL_VY = 9;
    let raf = 0;
    let last = performance.now();
    const start = last;
    const tick = (now) => {
      const elapsed = now - start;
      const step = Math.min((now - last) / BASE_FRAME_MS, 3);
      last = now;
      cannons.forEach((c, i) => {
        if (!fired[i] && elapsed >= c.delay) {
          fired[i] = true;
          for (let n = 0; n < c.count; n++) particles.push(makeParticle(c, rnd));
        }
      });
      ctx.clearRect(0, 0, width, height);
      const tailStart = DURATION - TAIL_FADE;
      const tailFade = elapsed > tailStart ? Math.max(0, 1 - (elapsed - tailStart) / TAIL_FADE) : 1;
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.vx *= Math.pow(DRAG_X, step);
        p.vy *= Math.pow(DRAG_Y, step);
        p.vy += GRAVITY * step;
        if (p.vy > TERMINAL_VY) p.vy = TERMINAL_VY;
        p.wobble += p.wobbleSpeed * step;
        const settled = Math.max(0, 1 - Math.abs(p.vx) / 6);
        p.x += (p.vx + Math.cos(p.wobble) * p.wobbleStrength * settled) * step;
        p.y += p.vy * step;
        p.tilt += p.tiltSpin * step;
        p.flip += p.flipSpeed * step;
        p.life -= p.decay * step;
        if (p.life <= 0 || p.y - 40 > height) {
          particles.splice(i, 1);
          continue;
        }
        const alpha = Math.min(1, p.life * 2.2);
        const squash = Math.cos(p.flip);
        ctx.save();
        ctx.globalAlpha = alpha * (squash < 0 ? 0.76 : 1) * tailFade;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.tilt);
        ctx.scale(1, squash);
        ctx.fillStyle = p.color;
        if (p.shape === "sequin") {
          ctx.beginPath();
          ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
          ctx.fill();
        } else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      if (elapsed < DURATION && (particles.length > 0 || elapsed < 400)) raf = requestAnimationFrame(tick);
      else ctx.clearRect(0, 0, width, height);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);
  return html`<canvas ref=${ref} class="ms-confetti" aria-hidden="true"></canvas>`;
}

function statusOf(s, p) {
  return s.mastered.includes(p.id) ? "mastered" : p.status;
}

function Outline({ s }) {
  const done = ALL.filter((p) => statusOf(s, p) === "mastered").length;
  return html`<nav aria-label=${T["Outline"]} style=${{ paddingBottom: 40 }}>
    <div class="row" style=${{ justifyContent: "space-between", gap: 8 }}>
      <span class="ms-o-label">${T["Outline"]}</span>
      <div class="row" style=${{ gap: 8 }}>
        <span class="ms-o-count">${done}/${ALL.length}</span>
        <span class="ms-o-hide" title=${T["Hide outline"]}><${Icon} name="chevrons-left" size=${14} /></span>
      </div>
    </div>
    <div class="ms-o-modules">
      ${MODULES.map(
        (m, mi) => html`<section key=${m.id}>
          <div class="row" style=${{ alignItems: "baseline", gap: 8 }}>
            <span class="ms-o-idx">${String(mi + 1).padStart(2, "0")}</span>
            <h2 class="ms-o-name">${m.name}</h2>
          </div>
          <ul class="ms-o-list">
            ${m.points.map((p) => {
              const st = statusOf(s, p);
              const current = p.id === s.waypoint;
              const just = p.id === s.just;
              const dot = st === "mastered" ? "is-mastered" : current ? "is-current" : st === "learning" ? "is-learning" : "is-new";
              return html`<li key=${p.id} style=${{ position: "relative" }}>
                <div class=${cx("ms-o-row", { "mastery-just-mastered-row": just, "is-current": current && !just })}>
                  <span class=${cx("ms-o-markbox", { "mastery-just-mastered-halo": just })} key=${p.id + (just ? "-just" : "")}>
                    <span class=${cx("ms-dot", dot, { "mastery-just-mastered-dot": just })}></span>
                  </span>
                  <span class=${cx("ms-o-text", { "is-current": current || just, "is-mastered": st === "mastered" && !current && !just })}>${p.name}</span>
                </div>
              </li>`;
            })}
          </ul>
        </section>`
      )}
    </div>
  </nav>`;
}

function QuestionCard({ s }) {
  const graded = s.card === "graded";
  const picked = s.picked;
  return html`<div class=${cx("mq", { "is-right": graded })}>
    <div class="mq__meta">${QUESTION.meta}</div>
    <div class="mq__prompt">${QUESTION.prompt}</div>
    <div class="mq__options">
      ${QUESTION.options.map((o) => {
        const on = graded ? o.label === QUESTION.correct : o.label === picked;
        return html`<div key=${o.label} class="mq__opt">
          <span class=${cx("mq__letter", { "is-on": on })}>${o.label}</span>
          <span class="mq__body">${o.body}</span>
        </div>`;
      })}
    </div>
    ${graded
      ? html`<div class="mq__ruling">
          <div><span class="mq__verdict">${T["Correct"]}</span></div>
          <div class="mq__explain">${QUESTION.explanation}</div>
          <button type="button" class="mq__challenge">${T["Review or challenge this assessment"]}</button>
        </div>`
      : s.card === "sent"
        ? html`<div class="mq__sent">${T["Answer submitted — your tutor is checking it."]}</div>`
        : html`<div class="mq__foot">
            <span class="mq__hint">${T["Pick the option you think is right."]}</span>
            <div class="row" style=${{ gap: 4 }}>
              <button type="button" class="mq__skip">${T["Skip this one"]}</button>
              <button type="button" class=${cx("mq__submit", { "dt-press": s.pressed === "submit" })} disabled=${!picked}>${T["Submit"]}</button>
            </div>
          </div>`}
  </div>`;
}

function Turn({ turn, text, children }) {
  const running = turn.phase === "running";
  const calls = turn.rows.length;
  return html`<div class="ms-turn animate-fade-in">
    <${ActivityHeader}
      label=${running ? (turn.rows.some((r) => r.state === "running") ? T["Tool Calling…"] : tt("{{name}} Reasoning…", { name: "DeepTutor" })) : T["DeepTutor responded."]}
      settled=${!running}
      duration=${running ? null : turn.duration}
      summary=${running ? null : tt("{{count}} tool calls", { count: calls })}
      expandable=${!running}
      expanded=${false}
    />
    ${running
      ? html`<div class="ms-rows">${turn.rows.map((r) => html`<${ActivityRow} key=${r.title} state=${r.state} title=${r.title} breathing=${r.state === "running"} />`)}</div>`
      : null}
    ${text ? html`<${Prose} text=${text} caret=${running} />` : null}
    ${children}
    ${!running
      ? html`<div class="ms-actions">
          <span title=${T["Copy"]}><${Icon} name="copy" size=${15} strokeWidth=${1.5} /></span>
          <span title=${T["Regenerate"]}><${Icon} name="refresh-cw" size=${15} strokeWidth=${1.5} /></span>
        </div>`
      : null}
  </div>`;
}

function render(s) {
  const done = ALL.filter((p) => statusOf(s, p) === "mastered").length;
  const waypointName = nameOf(s.waypoint);
  const t2Running = s.t2 && s.t2.phase === "running";
  const t3Running = s.t3 && s.t3.phase === "running";
  return html`<${Shell} active="/learning">
    <main class="ms-main mastery-shell">
      <header class="ms-head">
        <span class="ms-icon-btn" title=${T["Learning topics"]}><${Icon} name="arrow-left" size=${16} /></span>
        <div class="row min0 grow" style=${{ marginLeft: 6, alignItems: "baseline", gap: 8 }}>
          <h1 class="ms-topic">${DATA.mastery.title}</h1>
          <span class="ms-slash" aria-hidden="true">/</span>
          <span class="ms-waypoint animate-fade-in" key=${s.waypoint}>${waypointName}</span>
        </div>
        <div class="ms-modes" role="group" aria-label="会话模式">
          ${["outline", "study", "review"].map(
            (m) => html`<span key=${m} class=${cx("ms-mode", { "is-on": m === "study" })}><span class="ms-mode__dot"></span>${T["masteryMode." + m]}</span>`
          )}
        </div>
        <div class="row" style=${{ gap: 6, paddingLeft: 8 }}>
          <span class="ms-icon-btn" title=${T["Save to Notebook"]}><${Icon} name="bookmark-plus" size=${16} /></span>
          <span class="ms-icon-btn" title=${T["Activity"]}><${Icon} name="panel-right" size=${16} /></span>
          <${ProgressRing} value=${done / ALL.length} size=${18} stroke=${2} showLabel=${false} />
          <span class="ms-count">${done}/${ALL.length}</span>
        </div>
      </header>

      <div class="ms-body">
        <aside class="ms-aside"><${Outline} s=${s} /></aside>
        <section class="ms-chat">
          <div class="ms-scroll" id="ms-scroll" data-dt-scroll data-chat-scroll-root="true">
            <div class="ms-column">
              <div class="ms-turns">
                <${Turn} turn=${{ phase: "settled", rows: [{ title: "Mastery Status", state: "done" }, { title: "Mastery Quiz", state: "done" }], duration: "3s" }} text=${OPENING}>
                  <${QuestionCard} s=${s} />
                <//>
                ${s.t2 ? html`<${Turn} turn=${s.t2} text=${s.t2text} />` : null}
                ${s.user ? html`<div class="ms-user animate-fade-in"><div class="dt-user-bubble">${s.user}</div></div>` : null}
                ${s.t3 ? html`<${Turn} turn=${s.t3} text=${s.t3text} />` : null}
              </div>
            </div>
          </div>
          <div class="ms-composer-wrap">
            <div class="ms-composer-inner">
              <div class="dt-composer ms-surface">
                <div class=${cx("ms-input", { "is-empty": !s.draft, "dt-caret": s.focus })}>
                  ${s.draft || (s.focus ? "" : tt("Ask your tutor about “{{waypoint}}”…", { waypoint: waypointName }))}
                </div>
                <div class="ms-toolbar">
                  <span class="ms-tbtn" style=${{ marginRight: "auto" }}><${Icon} name="plus" size=${16} strokeWidth=${1.8} /></span>
                  <span class="ms-tbtn"><${Icon} name="sparkles" size=${16} strokeWidth=${1.7} /><span class="ms-tbtn__label">deepseek-chat</span><${Icon} name="chevron-down" size=${13} /></span>
                  <span class="ms-mic"><${Icon} name="mic" size=${16} strokeWidth=${1.9} /></span>
                  <span class=${cx("ms-send", { "is-ready": s.send === "ready" || (s.draft && s.send === "idle"), "is-streaming": s.send === "streaming" || t2Running || t3Running })}>
                    ${s.send === "streaming" || t2Running || t3Running ? html`<span class="ms-send__ring"></span>` : null}
                    ${s.send === "streaming" || t2Running || t3Running
                      ? html`<${Icon} name="square" size=${10} strokeWidth=${2.6} style=${{ fill: "currentColor" }} />`
                      : html`<${Icon} name="arrow-up" size=${16} strokeWidth=${2.5} />`}
                  </span>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
      ${s.confetti ? html`<${Confetti} key=${s.confetti} />` : null}
    </main>
  <//>`;
}

DT.run({ T, initial, steps, render });
</script>
