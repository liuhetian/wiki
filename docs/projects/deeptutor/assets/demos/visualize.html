<!DOCTYPE html>
<html lang="zh" class="theme-snow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="dt-height" content="560">
<title>DeepTutor 仿真 demo：可视化结果卡</title>
<!--
  Goal      可视化不是给一段画图代码，是在回答里直接出一张能用的图：t 分布、两侧拒绝域、例 8.3 的 t = 2.80，
            下面一排「显示代码 / 复制代码」，右上角能全屏
  Surface   聊天消息里的 Visualize 结果 · components/visualize/VisualizationViewer.tsx
  Sources   components/visualize/VisualizationViewer.tsx 49-118（ChartJsRenderer：Chart.js 自己管 canvas，外层 dt-chart-wrap）、
              495-509（右下角的类型标签「Chart.js · line」）、548-626（图区 rounded-xl border p-4、Fullscreen 小钮、
              显示代码 / 复制代码、深色代码面板）、640-675（全屏层 bg-black/85、关闭按钮、bg-card p-6 的大图）；
            components/visualize/svg-theme.css 18-41（dt-chart-wrap max-height 480、全屏时按宽度放大）；
            features/chat/messages/ChatMessageList.tsx 1826-1890（用户气泡）；components/activity/ActivityHeader.tsx
  Layout    没有侧栏，只有一条消息列：用户气泡 → 活动头 → 结果卡
  Data      DT.DATA.example（df 24、临界值 2.064、t 2.80）
  Autoplay  发问 → 推理中 → 图画出来（Chart.js 自带 900ms 动画）→ 显示代码 → 隐藏 → 全屏 → 关闭，一圈约 18s
  Height    560
  Deviations 图表配置是本 demo 写的（上游由模型生成）；全屏层画在 iframe 里（上游 portal 到 body）
  Checks    按钮文案、类型标签、全屏层文案与语言包一致；Chart 只在 useEffect 里 new
-->
<link rel="stylesheet" href="dt-base.css">
<style>
  .vz-page { height: 100%; overflow-y: auto; padding: 24px 0 32px; }
  /* 消息列 mx-auto max-w-[960px] space-y-9 px-6，这里窄一点 */
  .vz-column { margin: 0 auto; width: 100%; max-width: 760px; padding: 0 24px; display: flex; flex-direction: column; gap: 24px; }
  .vz-user { display: flex; justify-content: flex-end; }
  /* space-y-3 */
  .vz-viewer { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
  /* 图区：relative overflow-hidden rounded-xl border bg-background p-4 */
  .vz-figure { position: relative; overflow: hidden; border-radius: 12px; border-width: 1px; background: var(--background); padding: 16px; }
  /* Fullscreen：absolute right-2 top-2 inline-flex items-center gap-1 rounded-md border bg-background/90 px-2 py-1 text-[10px] font-medium */
  .vz-full { position: absolute; right: 8px; top: 8px; z-index: 10; display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; border-width: 1px; background: color-mix(in srgb, var(--background) 90%, transparent); padding: 4px 8px; font-size: 10px; font-weight: 500; color: var(--muted-foreground); backdrop-filter: blur(8px); transition: color 150ms; }
  .vz-full.is-hot { color: var(--foreground); }
  /* svg-theme.css：.dt-chart-wrap { max-height: 480px }，canvas 交给 Chart.js */
  .dt-chart-wrap { position: relative; width: 100%; max-height: 480px; }
  .dt-chart-wrap canvas { display: block; }
  /* 工具条：flex items-center gap-2；按钮 inline-flex gap-1.5 rounded-md border bg-background px-2.5 py-1.5 text-[11px] font-medium */
  .vz-tools { display: flex; align-items: center; gap: 8px; }
  .vz-btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; border-width: 1px; background: var(--background); padding: 6px 10px; font-size: 11px; font-weight: 500; color: var(--muted-foreground); transition: color 150ms; }
  .vz-btn.is-hot { color: var(--foreground); }
  /* 类型标签：ml-auto text-[10px] uppercase tracking-wider text-muted-foreground/50 */
  .vz-kind { margin-left: auto; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: color-mix(in srgb, var(--muted-foreground) 50%, transparent); }
  /* 代码面板：md-code-block rounded-xl border bg-[#1f2937]；头 border-b border-white/10 px-3 py-2 text-[11px] font-medium uppercase tracking-wider text-[#9ca3af]；
     pre max-h-80 overflow-auto p-4 text-[13px] leading-relaxed text-[#e5e7eb] */
  .vz-code { overflow: hidden; border-radius: 12px; border-width: 1px; background: #1f2937; }
  .vz-code__head { border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 12px; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: #9ca3af; }
  .vz-code pre { margin: 0; max-height: 320px; overflow: auto; padding: 16px; font-family: var(--font-mono); font-size: 13px; line-height: 1.625; color: #e5e7eb; white-space: pre; }
  /* 全屏层：fixed inset-0 z-[120] flex flex-col bg-black/85 p-4 backdrop-blur-sm */
  .vz-overlay { position: fixed; inset: 0; z-index: 120; display: flex; flex-direction: column; background: rgb(0 0 0 / 0.85); padding: 16px; backdrop-filter: blur(4px); }
  .vz-overlay__head { margin-bottom: 8px; display: flex; flex-shrink: 0; align-items: center; justify-content: space-between; color: #fff; }
  .vz-overlay__label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.8; }
  /* 关闭：inline-flex gap-1 rounded-md bg-white/10 px-2.5 py-1.5 text-[11px] font-medium text-white */
  .vz-overlay__close { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; background: rgb(255 255 255 / 0.1); padding: 6px 10px; font-size: 11px; font-weight: 500; color: #fff; }
  /* 面板：flex flex-1 overflow-auto rounded-xl bg-card p-6 shadow-2xl */
  .vz-overlay__panel { display: flex; flex: 1; min-height: 0; overflow: auto; border-radius: 12px; background: var(--card); padding: 24px; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25); }
  /* dt-viz-fullscreen：m-auto w-full max-w-[1600px]；Chart.js 按宽度放大 */
  .dt-viz-fullscreen { margin: auto; width: 100%; max-width: 1600px; }
  .dt-viz-fullscreen .dt-chart-wrap { max-height: none; max-width: min(100%, calc((100vh - 140px) * 2)); margin-inline: auto; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/vendor/htm.umd.js"></script>
<script src="dt-runtime.js"></script>
<script src="dt-data.js"></script>
<script src="/vendor/chartjs/chart.umd.js"></script>
<script>
"use strict";
const { html, Icon, cx, DATA, ActivityHeader, useElapsed } = DT;
const { useRef, useEffect } = DT.hooks;

DT.ICONS["code-2"] = "<path d=\"m18 16 4-4-4-4M6 8l-4 4 4 4M14.5 4l-5 16\"/>";

const T = {
  "Show code": "显示代码",
  "Hide code": "隐藏代码",
  "Copy code": "复制代码",
  "Fullscreen": "全屏",
  "Close": "关闭",
  "{{name}} Reasoning…": "{{name}} 推理中…",
  "DeepTutor responded.": "已完成",
};

const EX = DATA.example;
const ASK = "把例 8.3 的 t 分布和拒绝域画出来，标上 t = 2.80";
const KIND = "Chart.js · line";

/* 学生 t 分布的密度：Γ((ν+1)/2) / (√(νπ) Γ(ν/2)) · (1 + t²/ν)^(−(ν+1)/2)；ν = 24 时两个 Γ 用连乘算 */
const NU = EX.df;
function gammaHalfInt(n) {
  /* Γ(n + 0.5) = √π · Π_{k=0}^{n-1} (k + 0.5) */
  let p = Math.sqrt(Math.PI);
  for (let k = 0; k < n; k++) p *= k + 0.5;
  return p;
}
function factorial(n) {
  let p = 1;
  for (let k = 2; k <= n; k++) p *= k;
  return p;
}
const C = gammaHalfInt(NU / 2) / (Math.sqrt(NU * Math.PI) * factorial(NU / 2 - 1));
const pdf = (t) => C * Math.pow(1 + (t * t) / NU, -(NU + 1) / 2);
const xs = [];
for (let x = -4; x <= 4.0001; x += 0.05) xs.push(Math.round(x * 100) / 100);
const pts = (lo, hi) => xs.filter((x) => x >= lo && x <= hi).map((x) => ({ x, y: Number(pdf(x).toFixed(4)) }));
const CRIT = EX.crit;

/* 模型交出来的那份 Chart.js 配置（本 demo 写的，结构照 Chart.js 4） */
const CONFIG = {
  type: "scatter",
  data: {
    datasets: [
      { label: "t(24) 密度", data: pts(-4, 4), showLine: true, pointRadius: 0, borderColor: "#2563eb", borderWidth: 2, tension: 0.3 },
      { label: "拒绝域 α/2 = 0.025", data: pts(-4, -CRIT), showLine: true, pointRadius: 0, borderWidth: 0, fill: "origin", backgroundColor: "rgba(216, 90, 48, 0.28)" },
      { label: "拒绝域（右）", data: pts(CRIT, 4), showLine: true, pointRadius: 0, borderWidth: 0, fill: "origin", backgroundColor: "rgba(216, 90, 48, 0.28)" },
      { label: "例 8.3：t = 2.80", data: [{ x: EX.t, y: 0 }, { x: EX.t, y: 0.1 }], showLine: true, pointRadius: [0, 4], pointBackgroundColor: "#993c1d", borderColor: "#993c1d", borderWidth: 1.5, borderDash: [4, 4] },
    ],
  },
  options: {
    responsive: true,
    maintainAspectRatio: true,
    aspectRatio: 2,
    animation: { duration: 900 },
    plugins: {
      legend: { position: "bottom", labels: { boxWidth: 12, boxHeight: 8, filter: (item) => item.datasetIndex !== 2 } },
      title: { display: true, text: "单样本 t 检验：t(24) 分布与 α = 0.05 的拒绝域" },
    },
    scales: {
      x: { type: "linear", min: -4, max: 4, title: { display: true, text: "t" }, ticks: { stepSize: 1 } },
      y: { min: 0, max: 0.42, title: { display: true, text: "密度" } },
    },
  },
};

/* 「显示代码」里看到的那份：函数换成说明，数组只留开头 */
const CODE = JSON.stringify(
  CONFIG,
  (k, v) => {
    if (typeof v === "function") return undefined;
    if (k === "data" && Array.isArray(v) && v.length > 4) return v.slice(0, 3).concat(["…共 " + v.length + " 个点"]);
    return v;
  },
  2
);

function ChartCanvas({ round }) {
  const ref = useRef(null);
  useEffect(() => {
    const Chart = window.Chart;
    if (!Chart || !ref.current) return undefined;
    Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
    Chart.defaults.color = "#6e6e6e";
    Chart.defaults.borderColor = "#e5e5e5";
    const chart = new Chart(ref.current, CONFIG);
    return () => chart.destroy();
  }, [round]);
  return html`<div class="dt-chart-wrap"><canvas ref=${ref}></canvas></div>`;
}

function Header({ s, round }) {
  const secs = useElapsed(s.working && !s.card, round);
  return html`<${ActivityHeader}
    label=${s.card ? T["DeepTutor responded."] : T["{{name}} Reasoning…"].replace("{{name}}", "DeepTutor")}
    duration=${Math.max(1, Math.round(secs)) + "s"}
    settled=${s.card}
  />`;
}

const initial = { working: false, card: false, code: false, hotCode: false, hotFull: false, full: false };

const steps = [
  { at: 700, set: { working: true } },
  { at: 2000, set: { card: true } },
  { label: "chart-drawn" },
  { at: 2600, set: { hotCode: true } },
  { at: 250, set: { code: true, hotCode: false } },
  { at: 150, scroll: { sel: "#vz-scroll", bottom: true, ms: 520 } },
  { label: "code-shown" },
  { at: 3200, set: { hotCode: true } },
  { at: 250, set: { code: false, hotCode: false } },
  { at: 100, scroll: { sel: "#vz-scroll", top: 0, ms: 420 } },
  { at: 1100, set: { hotFull: true } },
  { at: 300, set: { full: true, hotFull: false } },
  { label: "fullscreen" },
  { at: 3600, set: { full: false } },
];

function VisualizeApp({ s, round }) {
  return html`<div class="vz-page" id="vz-scroll" data-dt-scroll>
    <div class="vz-column">
      <div class="vz-user"><div class="dt-user-bubble">${ASK}</div></div>
      ${s.working
        ? html`<div class="animate-fade-in">
            <${Header} s=${s} round=${round} />
            ${s.card
              ? html`<div class="vz-viewer animate-fade-in">
                  <div class="vz-figure">
                    <span class=${cx("vz-full", { "is-hot": s.hotFull, "dt-press": s.hotFull })}><${Icon} name="maximize-2" size=${10} strokeWidth=${1.8} />${T["Fullscreen"]}</span>
                    <${ChartCanvas} round=${round} />
                  </div>
                  <div class="vz-tools">
                    <span class=${cx("vz-btn", { "is-hot": s.hotCode, "dt-press": s.hotCode })}><${Icon} name="code-2" size=${12} strokeWidth=${1.8} />${s.code ? T["Hide code"] : T["Show code"]}</span>
                    <span class="vz-btn"><${Icon} name="copy" size=${12} strokeWidth=${1.8} />${T["Copy code"]}</span>
                    <span class="vz-kind">${KIND}</span>
                  </div>
                  ${s.code
                    ? html`<div class="vz-code dt-detail-in">
                        <div class="vz-code__head">json</div>
                        <pre><code>${CODE}</code></pre>
                      </div>`
                    : null}
                </div>`
              : null}
          </div>`
        : null}
    </div>
    ${s.full
      ? html`<div class="vz-overlay animate-overlay-in">
          <div class="vz-overlay__head">
            <div class="vz-overlay__label">${KIND}</div>
            <span class="vz-overlay__close"><${Icon} name="x" size=${12} strokeWidth=${1.8} />${T["Close"]}</span>
          </div>
          <div class="vz-overlay__panel animate-pop-in">
            <div class="dt-viz-fullscreen"><${ChartCanvas} round=${round} /></div>
          </div>
        </div>`
      : null}
  </div>`;
}

function render(s, tl) {
  return html`<${VisualizeApp} s=${s} round=${tl.round} />`;
}

DT.run({ T, initial, steps, render });
</script>
</body>
</html>
