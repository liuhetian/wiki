/* lib/reading-media-time.ts formatMediaTime：m:ss */
const mt = (sec) => Math.floor(sec / 60) + ":" + String(Math.floor(sec % 60)).padStart(2, "0");
/* 片段：video_learning/service.py build_segments 按句末把字幕并成 20–90 秒一段 */
const SEGMENT_STARTS = [0, 3, 5, 7, 9, 11];
const SEGMENTS = SEGMENT_STARTS.map((ci, i) => {
  const end = i + 1 < SEGMENT_STARTS.length ? CUES[SEGMENT_STARTS[i + 1]].t : LECTURE.duration;
  return { locator: i + 1, t: CUES[ci].t, end, title: mt(CUES[ci].t), text: CUES[ci].text };
});
const cueAt = (time) => CUES.findIndex((c) => time >= c.t && time < c.end);
const segAt = (time) => SEGMENTS.find((sg) => time >= sg.t && time < sg.end);
const chapterAt = (time) => LECTURE.chapters.filter((c) => c.t <= time).slice(-1)[0];

const QUESTION = "老师说 p 值是条件概率，条件是什么？在视频哪儿讲的？";
const ANSWER_RAW =
  "条件是**原假设为真**。讲定义时，老师特意强调了「在原假设成立的前提下」这几个字 [01:40]，紧接着说 p 值是一个条件概率，条件就是 $H₀$ 为真 [02:08]。";
/* lib/reading-media-citations.ts linkifyMediaTimestamps */
const ANSWER = ANSWER_RAW.replace(/\[(\d{1,2}):(\d{2})\]/g, (raw, m, s) => raw + "(#dt-media-time-" + (Number(m) * 60 + Number(s)) + ")");

const initial = {
  time: 88,
  playing: true,
  draft: "",
  focus: false,
  user: null,
  turn: null,
  answer: "",
  hot: false,
  send: "idle",
};

const tick = (t) => ({ at: 700, set: { time: t } });
const rows = (...states) =>
  ["Search Material", "Read Material"].slice(0, states.length).map((title, i) => ({ title, state: states[i] }));

const steps = [
  { label: "playing" },
  { at: 200, scroll: { sel: "#vr-list", to: '[data-active-cue="true"]', block: "center", behavior: "instant" } },
  tick(92),
  tick(96),
  tick(100),
  { at: 0, scroll: { sel: "#vr-list", to: '[data-active-cue="true"]', block: "center", ms: 300 } },
  tick(104),
  tick(108),
  { at: 200, scroll: { sel: "#vr-stage", to: '[data-vr="caption"]', block: "start", offset: 8, ms: 600 } },
  tick(112),
  tick(116),
  tick(120),
  tick(124),
  tick(128),
  { at: 0, scroll: { sel: "#vr-list", to: '[data-active-cue="true"]', block: "center", ms: 300 } },
  { label: "followed" },
  tick(132),
  tick(136),
  { at: 900, set: { playing: false, focus: true } },
  { at: 300, type: { key: "draft", text: QUESTION, cps: 15 } },
  { at: 300, set: { send: "ready" } },
  { at: 450, set: (s) => ({ user: s.draft, draft: "", focus: false, send: "streaming", turn: { phase: "running", rows: rows("running") } }) },
  { at: 1300, set: { turn: { phase: "running", rows: rows("done", "running") } } },
  { at: 1100, set: { turn: { phase: "running", rows: rows("done", "done") } } },
  { at: 300, stream: { key: "answer", text: ANSWER, chunk: [1, 3], ms: [20, 44] } },
  { at: 200, set: { turn: { phase: "settled", rows: rows("done", "done"), duration: "5s" }, send: "idle" } },
  { at: 60, scroll: { sel: "#vr-cscroll", bottom: true, ms: 360 } },
  { label: "answered" },
  { at: 1400, set: { hot: true } },
  { at: 260, set: { time: 100, playing: true } },
  { at: 0, scroll: { sel: "#vr-stage", top: 0, ms: 500 } },
  { at: 0, scroll: { sel: "#vr-list", to: '[data-active-cue="true"]', block: "center", behavior: "instant" } },
  { label: "seeked" },
  tick(103),
  tick(106),
  tick(109),
  { at: 2600, set: { hot: false } },
];

function Player({ s }) {
  const ch = chapterAt(s.time);
  const cue = CUES[cueAt(s.time)];
  const pct = (s.time / LECTURE.duration) * 100;
  return html`<div class="vr-video" data-vr="video">
    <div class="vr-slide">
      <div class="vr-slide__kicker">统计学 · 第 8 讲</div>
      <div class="vr-slide__title">什么是 p 值</div>
      <div class="vr-slide__line animate-fade-in" key=${ch.t}>${ch.title}</div>
      ${ch.t >= 100 ? html`<div class="vr-slide__formula">p = P( |T| ≥ 2.80 | H₀ 为真 )</div>` : html`<div class="vr-slide__formula">x̄ = 52.3，μ₀ = 50，n = 25</div>`}
    </div>
    ${cue ? html`<div class="vr-sub"><span>${cue.text}</span></div>` : null}
    <div class="vr-bar">
      <${Icon} name=${s.playing ? "pause" : "play"} size=${16} style=${{ fill: "currentColor" }} />
      <span class="vr-bar__time">${mt(s.time)} / ${mt(LECTURE.duration)}</span>
      <div class="vr-track">
        <div class="vr-track__buf" style=${{ width: Math.min(100, pct + 18) + "%" }}></div>
        <div class="vr-track__play" style=${{ width: pct + "%" }}></div>
        ${LECTURE.chapters.slice(1).map((c) => html`<span key=${c.t} class="vr-track__mark" style=${{ left: (c.t / LECTURE.duration) * 100 + "%" }}></span>`)}
        <div class="vr-track__knob" style=${{ left: pct + "%" }}></div>
      </div>
      <${Icon} name="captions" size=${16} />
      <${Icon} name="maximize-2" size=${14} />
    </div>
  </div>`;
}

function Navigator({ s }) {
  const seg = segAt(s.time);
  return html`<aside class="vr-nav">
    <div class="vr-nav__head">
      <div class="row min0 grow" role="tablist" style=${{ gap: 2 }}>
        <span class="vr-tab is-on"><${Icon} name="list-tree" size=${12} /><span class="truncate">${T["Contents"]}</span></span>
        <span class="vr-tab"><${Icon} name="highlighter" size=${12} /><span class="truncate">${T["Annotations"]}</span></span>
      </div>
      <span class="vr-hbtn" title=${T["Close contents"]}><${Icon} name="x" size=${13} /></span>
    </div>
    <label class="vr-search"><${Icon} name="search" size=${12} />${T["Search materials and contents"]}</label>
    <div class="vr-nav__list">
      <div class="vr-mat">
        <span class="vr-mat__btn"><${Icon} name="circle-play" size=${12} /><span class="clamp2">${LECTURE.title}</span></span>
        <span class="vr-hbtn" style=${{ marginRight: 4, height: 22, width: 22 }}><${Icon} name="chevron-down" size=${11} /></span>
      </div>
      <div class="vr-branch">
        ${SEGMENTS.map(
          (sg) => html`<div key=${sg.locator} class=${cx("vr-seg", { "is-on": seg && seg.locator === sg.locator })}>
            <span class="vr-seg__t">${sg.title}</span>
            <span class="vr-seg__text">${sg.text}</span>
          </div>`
        )}
      </div>
    </div>
    <div class="vr-nav__foot">${tt("{{count}} passages available to the companion", { count: SEGMENTS.length })}</div>
  </aside>`;
}

function Stage({ s }) {
  const ci = cueAt(s.time);
  const now = CUES[ci];
  const next = CUES[ci + 1];
  const seg = segAt(s.time);
  return html`<section class="vr-center">
    <div class="vr-stagehead">
      <div class="min0">
        <p style=${{ fontWeight: 600 }}>${LECTURE.title}</p>
        <p class="muted">Bilibili · ${seg.title}</p>
      </div>
      <div class="row" style=${{ gap: 8 }}>
        <span class="vr-mini vr-mini--icon" title=${T["Enter fullscreen"]}><${Icon} name="maximize-2" size=${11} /></span>
        <span class="vr-official">${T["Open official"]}<${Icon} name="external-link" size=${9} /></span>
      </div>
    </div>
    <div class="vr-stage" id="vr-stage" data-dt-scroll>
      <div class="vr-stage__inner">
        <${Player} s=${s} />
        <div class="vr-caption" aria-live="polite" data-vr="caption">
          ${[now, next].map((row, i) =>
            row
              ? html`<div key=${row.t} class=${cx("vr-cap", { "is-now": i === 0 })}>
                  <span class="vr-cap__t">${mt(row.t)}</span>
                  <span class="vr-cap__text">${row.text}</span>
                </div>`
              : null
          )}
        </div>
        <div class="vr-passage">
          <div class="min0">
            <p class="vr-passage__label">${T["Current passage"]}</p>
            <p class="vr-passage__value">${seg.title}</p>
          </div>
          <div class="row" style=${{ gap: 4 }}>
            <span class="vr-mini vr-mini--icon" title=${T["Add segment note"]}><${Icon} name="sticky-note" size=${12} /></span>
            <span class="vr-mini">${T["Previous"]}</span>
            <span class="vr-mini">${T["Next"]}</span>
          </div>
        </div>
        <div class="vr-notes">
          <span class="vr-notes__add"><${Icon} name="plus" size=${12} />${T["Add a note for this segment"]}</span>
        </div>
        <div class="vr-tx" data-vr="transcript">
          <div class="vr-tx__head">
            <label class="vr-tx__search"><${Icon} name="search" size=${12} />${T["Search transcript"]}</label>
            <div class="row" style=${{ gap: 4 }}>
              <span class="vr-tx__step" title=${T["Previous transcript match"]}><${Icon} name="chevron-up" size=${11} /></span>
              <span class="vr-tx__step" title=${T["Next transcript match"]}><${Icon} name="chevron-down" size=${11} /></span>
              <span class="vr-follow is-on"><${Icon} name="chevrons-down" size=${11} />${T["Follow playback"]}</span>
            </div>
          </div>
          <div class="vr-tx__list" id="vr-list" data-dt-scroll>
            ${CUES.map((c, i) => {
              const on = i === ci;
              return html`<div key=${c.t} class=${cx("vr-cue", { "is-on": on })} data-active-cue=${on ? "true" : undefined} data-transcript-cue=${i}>
                <span class="vr-cue__t">${mt(c.t)}</span>
                <span class="vr-cue__text">${c.text}</span>
              </div>`;
            })}
          </div>
        </div>
      </div>
    </div>
  </section>`;
}

function Turn({ s }) {
  const t = s.turn;
  const running = t.phase === "running";
  const toolBusy = t.rows.some((r) => r.state === "running");
  return html`<div class="vr-turn animate-fade-in" role="article">
    <${ActivityHeader}
      label=${running ? (toolBusy ? T["Tool Calling…"] : tt("{{name}} Exploring…", { name: "DeepTutor" })) : T["DeepTutor responded."]}
      settled=${!running}
      duration=${running ? null : t.duration}
      summary=${running ? null : tt("{{count}} tool calls", { count: t.rows.length })}
      expandable=${!running}
    />
    ${running ? html`<div class="vr-rows">${t.rows.map((r) => html`<${ActivityRow} key=${r.title} state=${r.state} title=${r.title} breathing=${r.state === "running"} />`)}</div>` : null}
    ${s.answer ? html`<div class=${s.hot ? "vr-hot" : ""}><${Prose} text=${s.answer} caret=${running} /></div>` : null}
  </div>`;
}

function render(s) {
  const streaming = s.send === "streaming";
  return html`<main class="vr-main" data-reading-workspace="" data-learning="true">
    <header class="vr-head">
      <span class="vr-hbtn" title=${T["Back to folder"]}><${Icon} name="arrow-left" size=${14} /></span>
      <span class="vr-hbtn is-on" title=${T["Collapse contents"]}><${Icon} name="panel-left-close" size=${14} /></span>
      <span class="vr-title">第 8 章　${DATA.book.chapter.title}</span>
      <span class="vr-hbtn" title=${T["Add material"]}><${Icon} name="plus" size=${14} /></span>
      <div class="row" style=${{ marginLeft: "auto", gap: 2 }}>
        <span class="vr-hbtn"><${Icon} name="volume-2" size=${14} /></span>
        <span class="vr-hbtn"><${Icon} name="list-checks" size=${14} /></span>
        <span class="vr-hbtn is-on" title=${T["Exit learning mode"]}><${Icon} name="minimize-2" size=${14} /></span>
        <span class="vr-hbtn"><${Icon} name="ellipsis" size=${14} /></span>
        <span class="vr-hbtn" title=${T["New conversation"]}><${Icon} name="square-pen" size=${14} /></span>
        <span class="vr-hbtn is-on" title=${T["Reading companion"]}><${Icon} name="panel-right-close" size=${14} /></span>
      </div>
    </header>
    <div class="vr-grid">
      <${Navigator} s=${s} />
      <${Stage} s=${s} />
      <div class="vr-sep" role="separator"></div>
      <aside class="vr-companion">
        <div class="vr-c-scroll" id="vr-cscroll" data-dt-scroll data-chat-scroll-root="true">
          ${s.user
            ? html`<div class="vr-turns">
                <div class="vr-user animate-fade-in"><div class="dt-user-bubble">${s.user}</div></div>
                ${s.turn ? html`<${Turn} s=${s} />` : null}
              </div>`
            : html`<div class="vr-welcome">
                <${Icon} name="captions" size=${30} strokeWidth=${1.4} style=${{ color: "var(--primary)" }} />
                <p class="vr-welcome__title">${T["Read and ask as you go"]}</p>
                <p class="vr-welcome__body">${WELCOME_BODY}</p>
              </div>`}
        </div>
        <div class="vr-c-composer">
          <div class="dt-composer">
            <div class=${cx("vr-input", { "is-empty": !s.draft, "dt-caret": s.focus })}>${s.draft || (s.focus ? "" : T["Ask about this material…"])}</div>
            <div class="vr-toolbar">
              <span class="vr-tbtn" style=${{ marginRight: "auto" }}><${Icon} name="plus" size=${16} strokeWidth=${1.8} /></span>
              <span class="vr-tbtn"><${Icon} name="sparkles" size=${16} strokeWidth=${1.7} /><${Icon} name="chevron-down" size=${13} /></span>
              <span class="vr-mic"><${Icon} name="mic" size=${16} strokeWidth=${1.9} /></span>
              <span class=${cx("vr-send", { "is-ready": s.send === "ready" || (s.draft && !streaming), "is-streaming": streaming })}>
                ${streaming ? html`<span class="vr-send__ring"></span>` : null}
                ${streaming
                  ? html`<${Icon} name="square" size=${10} strokeWidth=${2.6} style=${{ fill: "currentColor" }} />`
                  : html`<${Icon} name="arrow-up" size=${16} strokeWidth=${2.5} />`}
              </span>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </main>`;
}

DT.run({ T, initial, steps, render });
</script>
</body>
</html>
