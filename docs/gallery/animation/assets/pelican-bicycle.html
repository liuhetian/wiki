<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px 16px;
    background: radial-gradient(ellipse at 50% 0%, #2b3b57 0%, #121a2a 65%, #0b1019 100%);
    color: #e8edf6;
    font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  h1 {
    margin: 0;
    font-size: clamp(18px, 3vw, 26px);
    font-weight: 600;
    letter-spacing: .12em;
    text-align: center;
  }
  h1 small {
    display: block;
    margin-top: 6px;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: .04em;
    color: #9fb0c9;
  }
  .stage {
    width: min(960px, 100%);
    border-radius: 20px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .06);
  }
  .stage svg { display: block; width: 100%; height: auto; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 12px 22px;
    font-size: 14px;
    color: #c9d4e6;
  }
  .controls button {
    appearance: none;
    border: 0;
    cursor: pointer;
    padding: 8px 18px;
    border-radius: 999px;
    background: #f5a623;
    color: #2a1a00;
    font-weight: 600;
    font-size: 14px;
    box-shadow: 0 4px 14px rgba(245, 166, 35, .35);
    transition: transform .15s, background .15s;
  }
  .controls button:hover { background: #ffb940; }
  .controls button:active { transform: scale(.96); }
  .controls label { display: flex; align-items: center; gap: 10px; }
  .controls input[type=range] { width: 180px; accent-color: #f5a623; }
  .controls output, .controls .odo b {
    display: inline-block;
    min-width: 3.4em;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .hint { font-size: 12px; color: #7f8ea6; }
</style>
</head>
<body>

<h1>鹈鹕骑自行车<small>纯 SVG 绘制 · JavaScript 驱动的 2D 动画</small></h1>

<div class="stage" id="stage" title="点击画面：暂停 / 继续">
<svg id="scene" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svgTitle svgDesc">

  <defs>

      <stop offset="1" stop-color="#d8cfbf"/>

    <linearGradient id="gWing" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="458" y2="0">

      <stop offset="0.64" stop-color="#e6dfd1"/>
      <stop offset="0.675" stop-color="#3d3d44"/>
      <stop offset="1" stop-color="#1f1f23"/>

    <linearGradient id="gWingFar" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="458" y2="0">
      <stop offset="0" stop-color="#d6cfc1"/>
      <stop offset="0.64" stop-color="#c1b8a7"/>
      <stop offset="0.675" stop-color="#2e2e33"/>

      <circle cx="17" cy="-54" r="19" fill="#4a9343"/>

      <path d="M446 124 C462 136 492 140 520 132" fill="none" stroke="#ffc58f" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <line x1="430" y1="106" x2="550" y2="119" stroke="#a4501b" stroke-width="1.6" stroke-linecap="round"/>
      <ellipse cx="412" cy="108" rx="6" ry="3.5" fill="#ffb3a7" opacity="0.45"/>
      <ellipse cx="418" cy="94" rx="8" ry="7" fill="#f6cfae"/>
      <g id="eye">
        <circle cx="418" cy="94" r="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
        <circle cx="419.5" cy="94" r="2.6" fill="#1a1a1a"/>
        <circle cx="420.5" cy="93" r="0.9" fill="#ffffff"/>
      </g>
    </g>
  </g>
</svg>
</div>

<div class="controls">
  <button id="toggle" type="button" aria-pressed="false">⏸ 暂停</button>
  <label>速度 <input id="speed" type="range" min="0" max="2.5" step="0.05" value="1" /><output id="speedOut">1.00×</output></label>
  <span class="odo">里程 <b id="odo">0.0</b> 米</span>
</div>
<div class="hint">空格 / 点击画面：暂停或继续 · ← → 调节速度</div>
<noscript><p>需要启用 JavaScript 才能播放动画。</p></noscript>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (id) => document.getElementById(id);
  const fx = (n) => n.toFixed(2);
  const make = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };

  // ---------- 几何常量（与 SVG 中坐标一致） ----------
  const WHEEL_R = 72;               // 车轮外径（轮胎接地）
  const BB = { x: 370, y: 368 };    // 中轴
  const CRANK = 28;                 // 曲柄长度
  const RING_R = 20, COG_R = 12;    // 牙盘 / 飞轮半径
  const GEAR = RING_R / COG_R;      // 传动比：车轮角速度 = 曲柄角速度 × GEAR
  const THIGH = 84, SHIN = 84;      // 大腿 / 小腿长度
  const HIP_NEAR = { x: 350, y: 230 };
  const HIP_FAR = { x: 343, y: 226 };
  const BASE_WHEEL_SPEED = 4.2;     // 1× 速度时车轮角速度 (rad/s)
  const PX_PER_METER = 205;         // 轮径 ≈ 0.7 m

  // ---------- 生成辐条、牙盘爪、山丘 ----------
  for (const id of ['rearSpokes', 'frontSpokes']) {
    const g = $(id);
    for (let i = 0; i < 20; i++) {
      const a = (i / 20) * Math.PI * 2;
      const off = (i % 2 ? 1 : -1) * 0.45;   // 切向编法，交叉辐条
      make('line', {
        x1: fx(7 * Math.cos(a + off)), y1: fx(7 * Math.sin(a + off)),
        x2: fx(61 * Math.cos(a)), y2: fx(61 * Math.sin(a)),
      }, g);
    }
  }
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    make('line', { x1: 0, y1: 0, x2: fx(15 * Math.cos(a)), y2: fx(15 * Math.sin(a)) }, $('spider'));
  }

  // 周期为 900 的正弦叠加曲线，保证平铺无缝
  function wavePath(base, terms, bottom) {
    let d = '';
    for (let x = 0; x <= 900; x += 10) {
      let y = base;
      for (const [amp, k, ph] of terms) y += amp * Math.sin((2 * Math.PI * k * x) / 900 + ph);
      d += (x ? 'L' : 'M') + x + ' ' + fx(y) + ' ';
    }
    return d + `L900 ${bottom} L0 ${bottom} Z`;
  }
  $('hillsBackTile').setAttribute('d', wavePath(360, [[20, 1, 0.4], [9, 3, 1.3], [4, 6, 2.1]], 420));
  $('hillsFrontTile').setAttribute('d', wavePath(388, [[11, 2, 0.9], [6, 3, 2.6], [3, 7, 0.5]], 420));

  // 速度线 & 扬尘
  const speedLines = [140, 168, 196, 226].map((y) =>
    make('line', { y1: y, y2: y, stroke: '#ffffff', 'stroke-width': 3, 'stroke-linecap': 'round' }, $('speedLines')));
  const dust = Array.from({ length: 6 }, () => make('circle', { r: 4, fill: '#d9cfb8' }, $('dust')));

  // ---------- 元素引用 ----------
  const legs = {};
  for (const side of ['Near', 'Far']) {
    const g = $('leg' + side);
    legs[side] = {
      thigh: g.querySelectorAll('.thigh'),
      shin: g.querySelectorAll('.shin'),
      foot: g.querySelector('.foot'),
      pedal: $('pedal' + side),
      crank: $('crank' + side),
    };
  }
  const E = {
    rearSpin: $('rearSpin'), frontSpin: $('frontSpin'), cogSpin: $('cogSpin'),
    ringSpin: $('ringSpin'), spiderSpin: $('spiderSpin'), chain: $('chain'),
    rider: $('rider'), riderFar: $('riderFar'), headBack: $('headBack'), headFront: $('headFront'),
    eye: $('eye'), crest: $('crest'), pouch: $('pouch'), scarf1: $('scarf1'), scarf2: $('scarf2'),
    fishA: $('fishA'), fishB: $('fishB'),
    clouds: $('lyrClouds'), mountains: $('lyrMountains'), hillsBack: $('lyrHillsBack'),
    hillsFront: $('lyrHillsFront'), trees: $('lyrTrees'), road: $('lyrRoad'),
    grass: $('lyrGrass'), roadDash: $('roadDash'), odo: $('odo'),
  };

  // ---------- 两段骨骼 IK：膝盖朝前 ----------
  function solveKnee(hip, ankle) {
    const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const d = Math.min(THIGH + SHIN - 0.01, Math.max(Math.abs(THIGH - SHIN) + 0.01, len));
    const a = (THIGH * THIGH - SHIN * SHIN + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, THIGH * THIGH - a * a));
    return { x: hip.x + ux * a + uy * h, y: hip.y + uy * a - ux * h };
  }
  function setLine(e, a, b) {
    e.setAttribute('x1', fx(a.x)); e.setAttribute('y1', fx(a.y));
    e.setAttribute('x2', fx(b.x)); e.setAttribute('y2', fx(b.y));
  }
  function updateLeg(L, hip, pedal) {
    const ankle = { x: pedal.x - 5, y: pedal.y - 7 };
    const knee = solveKnee(hip, ankle);
    L.thigh.forEach((e) => setLine(e, hip, knee));
    L.shin.forEach((e) => setLine(e, knee, ankle));
    L.foot.setAttribute('transform', `translate(${fx(pedal.x)} ${fx(pedal.y - 4)})`);
    L.pedal.setAttribute('x', fx(pedal.x - 11));
    L.pedal.setAttribute('y', fx(pedal.y - 3));
    L.crank.setAttribute('x2', fx(pedal.x));
    L.crank.setAttribute('y2', fx(pedal.y));
  }

  // ---------- 飘动的围巾（燕尾丝带） ----------
  function ribbon(x0, y0, len, width, ang, amp, phase) {
    const dx = -Math.cos(ang), dy = Math.sin(ang);   // 向后下方延伸
    const px = -dy, py = dx;                          // 法线
    const N = 16, top = [], bot = [];
    let cx = x0, cy = y0;
    for (let i = 0; i <= N; i++) {
      const s = i / N;
      const w = amp * s * Math.sin(s * 6 - phase);
      cx = x0 + dx * s * len + px * w;
      cy = y0 + dy * s * len + py * w;
      const hw = (width * (1 - 0.35 * s)) / 2;
      top.push([cx + px * hw, cy + py * hw]);
      bot.push([cx - px * hw, cy - py * hw]);
    }
    let d = `M${fx(top[0][0])} ${fx(top[0][1])}`;
    for (let i = 1; i <= N; i++) d += ` L${fx(top[i][0])} ${fx(top[i][1])}`;
    d += ` L${fx(cx - dx * 7)} ${fx(cy - dy * 7)}`;   // 燕尾缺口
    for (let i = N; i >= 0; i--) d += ` L${fx(bot[i][0])} ${fx(bot[i][1])}`;
    return d + ' Z';
  }

  // ---------- 状态 ----------
  let playing = true;
  let last = null;
  let t = 0;          // 总时间（用于眨眼、点头等）
  let wheel = 0;      // 车轮累计转角 (rad)
  let wind = 0;       // 风相位（随速度累加，变速时不跳变）
  let speed = 1, target = 1;

  const shift = (el, off, period) =>
    el.setAttribute('transform', `translate(${fx(-(off % period))} 0)`);

  function render() {
    const dist = wheel * WHEEL_R;          // 无滑动滚动：路面位移 = 转角 × 半径
    const crank = wheel / GEAR;
    const wDeg = fx((wheel * 180) / Math.PI);
    const cDeg = fx((crank * 180) / Math.PI);

    // 车轮、飞轮、牙盘、链条
    E.rearSpin.setAttribute('transform', `rotate(${wDeg})`);
    E.frontSpin.setAttribute('transform', `rotate(${wDeg})`);
    E.cogSpin.setAttribute('transform', `rotate(${wDeg})`);
    E.ringSpin.setAttribute('transform', `rotate(${cDeg})`);
    E.spiderSpin.setAttribute('transform', `rotate(${cDeg})`);
    E.chain.setAttribute('stroke-dashoffset', fx((crank * RING_R) % 6.5));

    // 踏板与腿
    const cs = Math.cos(crank), sn = Math.sin(crank);
    const pNear = { x: BB.x + CRANK * cs, y: BB.y + CRANK * sn };
    const pFar = { x: BB.x - CRANK * cs, y: BB.y - CRANK * sn };
    const bob = 1.8 * Math.sin(2 * crank + 0.5);   // 每圈两次蹬踏起伏
    updateLeg(legs.Near, { x: HIP_NEAR.x, y: HIP_NEAR.y + bob }, pNear);
    updateLeg(legs.Far, { x: HIP_FAR.x, y: HIP_FAR.y + bob }, pFar);

    // 上半身
    const bodyT = `translate(0 ${fx(bob)})`;
    E.rider.setAttribute('transform', bodyT);
    E.riderFar.setAttribute('transform', bodyT);

    const nod = 1.5 * Math.sin(2 * crank + 1.2) + 1.2 * Math.sin(t * 1.1);
    const headT = `rotate(${fx(nod)} 400 118)`;
    E.headBack.setAttribute('transform', headT);
    E.headFront.setAttribute('transform', headT);

    // 眨眼
    const u = t % 3.6;
    const lid = u < 0.18 ? Math.max(0.1, Math.abs(Math.cos((Math.PI * u) / 0.18))) : 1;
    E.eye.setAttribute('transform', `translate(418 94) scale(1 ${fx(lid)}) translate(-418 -94)`);

    // 喉囊晃动
    const j = 2.6 * Math.sin(2 * crank + 1.6) + 1.4 * Math.sin(t * 7.3);
    E.pouch.setAttribute('d',
      `M430 106 L550 119 C540 ${fx(142 + j * 0.6)} 500 ${fx(158 + j)} 466 ${fx(156 + j)} ` +
      `C442 ${fx(154 + j * 0.9)} 430 ${fx(136 + j * 0.4)} 430 106 Z`);

    // 羽冠、围巾随风
    E.crest.setAttribute('transform', `rotate(${fx(-3 + 4 * Math.sin(wind * 10))} 392 92)`);
    const ang = speed >= 1 ? Math.max(0.06, 0.2 - 0.07 * (speed - 1)) : 1.25 - 1.05 * speed;
    const amp = 1 + 4 * Math.min(speed, 1.8);
    E.scarf1.setAttribute('d', ribbon(388, 158, 96, 10, ang, amp, wind * 9));
    E.scarf2.setAttribute('d', ribbon(388, 163, 80, 9, ang + 0.12, amp * 0.9, wind * 9 - 1.4));

    // 车筐里的鱼
    E.fishA.setAttribute('transform', `rotate(${fx(3 * Math.sin(t * 2.3))} 503 232)`);
    E.fishB.setAttribute('transform', `rotate(${fx(9 * Math.sin(t * 6.5))} 528 234)`);

    // 速度线与扬尘
    const lineAlpha = Math.min(1, Math.max(0, (speed - 0.25) / 0.9));
    speedLines.forEach((ln, i) => {
      const p = (dist / 300 + i * 0.29) % 1;
      const x2 = 228 - p * 150;
      const len = 26 + 22 * Math.sin(p * Math.PI);
      ln.setAttribute('x1', fx(x2 - len));
      ln.setAttribute('x2', fx(x2));
      ln.setAttribute('opacity', fx(Math.sin(p * Math.PI) * 0.75 * lineAlpha));
    });
    dust.forEach((c, i) => {
      const p = (dist / 160 + i / dust.length) % 1;
      c.setAttribute('cx', fx(176 - p * 110));
      c.setAttribute('cy', fx(426 - p * 16 - (i % 2) * 3));
      c.setAttribute('r', fx(3 + p * 9));
      c.setAttribute('opacity', fx((1 - p) * 0.5 * Math.min(1, speed)));
    });

    // 视差背景
    shift(E.clouds, dist * 0.04 + t * 6, 900);
    shift(E.mountains, dist * 0.08, 900);
    shift(E.hillsBack, dist * 0.18, 900);
    shift(E.hillsFront, dist * 0.32, 900);
    shift(E.trees, dist * 0.55, 450);
    shift(E.road, dist, 300);
    E.roadDash.setAttribute('stroke-dashoffset', fx(dist % 72));
    shift(E.grass, dist * 1.25, 300);

    E.odo.textContent = (dist / PX_PER_METER).toFixed(1);
  }

  function frame(now) {
    if (last === null) last = now;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (playing) {
      speed += (target - speed) * Math.min(1, dt * 3);   // 平滑变速
      t += dt;
      wind += dt * (0.5 + speed);
      wheel += BASE_WHEEL_SPEED * speed * dt;
      render();
    }
    requestAnimationFrame(frame);
  }

  // ---------- 控件 ----------
  const btn = $('toggle'), range = $('speed'), out = $('speedOut');
  function setPlaying(p) {
    playing = p;
    btn.textContent = p ? '⏸ 暂停' : '▶ 继续';
    btn.setAttribute('aria-pressed', String(!p));
  }
  function setTarget(v) {
    target = Math.min(2.5, Math.max(0, v));
    range.value = String(target);
    out.textContent = target.toFixed(2) + '×';
  }
  btn.addEventListener('click', () => setPlaying(!playing));
  $('stage').addEventListener('click', () => setPlaying(!playing));
  range.addEventListener('input', () => setTarget(parseFloat(range.value)));
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target !== btn) {
      e.preventDefault();
      setPlaying(!playing);
    } else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target !== range) {
      e.preventDefault();
      setTarget(target + (e.key === 'ArrowRight' ? 0.1 : -0.1));
    }
  });

  render();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
