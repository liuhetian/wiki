<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf3e3" />
  <title>小橘猫 · 程序化低多边形模型</title>
  <style>
    :root { --ink: #4b4137; --muted: #8d8173; --card: rgba(255, 252, 246, 0.9); --btn: #f3ece0; --accent: #f08a34;
      --shadow: 0 10px 34px rgba(98, 76, 44, 0.13), 0 2px 6px rgba(98, 76, 44, 0.06); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fbf3e3; color: var(--ink);
      font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
    .bar { position: fixed; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
    .bar > * { pointer-events: auto; }
    .card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .title { padding: 10px 14px; }
    .title h1 { margin: 0; font-size: 15px; }
    .title small { display: block; margin-top: 2px; font-size: 11.5px; color: var(--muted); }
    .title a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .chip { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border: 0; border-radius: 13px;
      background: var(--card); color: var(--ink); font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow); }
    .chip.on { background: var(--accent); color: #fff; }
    .chip:active { transform: scale(.96); }
    .ref { position: fixed; left: 14px; bottom: 14px; padding: 8px; width: 150px; }
    .ref img { display: block; width: 100%; border-radius: 10px; image-rendering: pixelated; }
    .ref span { display: block; text-align: center; font-size: 11px; color: var(--muted); margin-top: 5px; }
    .hint { position: fixed; right: 14px; bottom: 14px; padding: 9px 14px; font-size: 12px; color: var(--muted); border-radius: 999px; }
    @media (max-width: 600px) {
      .bar { top: 10px; left: 10px; right: 10px; }
      .title { padding: 9px 12px; }
      .title h1 { font-size: 14px; white-space: nowrap; }
      .title small { font-size: 11px; }
      .tools { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); flex-wrap: nowrap; }
      .chip { height: 38px; padding: 0 13px; font-size: 13px; white-space: nowrap; }
      .ref { left: auto; right: 10px; top: 10px; bottom: auto; width: 84px; padding: 6px; }
      .ref span { margin-top: 3px; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="小橘猫 3D 模型"></canvas>
  <div class="bar">
    <div class="card title">
      <h1>小橘猫 · 3D 模型</h1>
      <small>全部为程序化低多边形几何</small>
    </div>
    <div class="tools">
      <button class="chip on" id="play"><span>暂停动画</span></button>
      <button class="chip" id="spin">自动旋转</button>
      <button class="chip" id="reset">重置视角</button>
    </div>
  </div>
  <figure class="card ref" id="ref" style="margin:0">
    <img src="cat-reference.png" alt="参考图" onerror="document.getElementById('ref').remove()" />
    <span>参考图</span>
  </figure>
  <div class="card hint">拖动旋转 · 滚轮/双指缩放 · 右键拖动平移</div>

  <!-- 运行时用全站 /vendor 的 three（ES Module），挂到 window.THREE 后按顺序加载普通脚本 -->
  <!-- 轨道相机和牧场共用一份，从 Gallery 牧场的目录加载，不另存 -->
  <script type="module">
    import * as THREE from '/vendor/three/three.module.min.js';
    window.THREE = THREE;
    for (const src of ['js/cat.js', '/gallery/games/assets/lowpoly-ranch/js/controls.js', 'js/cat-viewer.js']) {
      await new Promise((ok, fail) => {
        const s = document.createElement('script');
        s.src = src; s.onload = ok; s.onerror = fail;
        document.body.appendChild(s);
      });
    }
  </script>
</body>
</html>
