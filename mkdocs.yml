  - 课程:
      - courses/index.md
      - Git:
          - courses/git/index.md
          - 1. 先用起来:
              - clone 的第一课：仓库地址不在 GitHub 上: courses/git/clone-basics.md
              - clone 到指定目录：最后那个参数不是可选装饰: courses/git/clone-into-dir.md
              - 一条 clone 要同时拿对分支和子模块: courses/git/clone-branch-submodule.md
              - 浅克隆 + 稀疏检出，然后再把历史补回来: courses/git/shallow-sparse-clone.md
              - 第一次把改动交上去：add、commit、push 各管一段: courses/git/add-commit-push.md
              - 只提交该提交的那部分: courses/git/status-selective-add.md
              - 把暂存区清干净、把文件改回去、再让它们别再来: courses/git/discard-changes-gitignore.md
          - 2. 三个区与 .git:
              - 从普通目录跨进 Git 仓库: courses/git/init-first-push.md
              - 默认分支名不是装饰：init 出来叫 master 怎么办: courses/git/init-default-branch.md
              - 掀开 .git 看一眼，然后把它删了再建回来: courses/git/dot-git-anatomy.md
              - 只从暂存区移走，别把文件也删了: courses/git/rm-cached-unstage.md
              - 还没推出去，赶紧把这次提交撤回来: courses/git/reset-unpushed-commit.md
              - 已经推上去的敏感文件，删得掉吗: courses/git/rm-vs-rm-cached.md
          - 3. 和别人一起改:
              - 第一次合并冲突：读懂那三行标记: courses/git/first-merge-conflict.md
              - 顺序敏感的冲突：把两半拼起来会拼出重复调用: courses/git/conflict-order-matters.md
              - 同一行上的冲突：两个业务意图要合成一个: courses/git/conflict-same-line.md
              - 多文件冲突，其中一个是二进制: courses/git/conflict-multi-file-binary.md
              - 别在 main 上裸奔：开分支、做完、合回去: courses/git/feature-branch-merge.md
              - 两条独立的功能分支同时推进: courses/git/two-parallel-branches.md
              - 半成品先塞抽屉：stash 出去救火再回来: courses/git/stash-switch-hotfix.md
              - 三份 stash：认出来、用掉一份、转走一份、留下一份: courses/git/stash-multiple-to-branch.md
          - 4. 整理历史:
              - 提交说明写歪了，推之前还能改: courses/git/amend-message.md
              - amend 补文件，rebase -i reword 改更早的说明: courses/git/amend-files-reword.md
              - 「fix typo」三连击：把杂乱历史压成一条: courses/git/rebase-squash-fixups.md
              - 把一坨 wip 拆开，还要重排顺序: courses/git/rebase-split-reorder.md
          - 5. 救火:
              - 已经推出去了，只能体面地反着来一次: courses/git/revert-pushed-commit.md
              - 后悔药分软硬两款：soft 与 mixed 的差别: courses/git/reset-soft-mixed.md
              - 连环翻车：连续 revert 三条，再把本地废提交丢掉: courses/git/revert-chain-reset-hard.md
              - 撤销一次 merge，修好之后还得先撤回那次撤回: courses/git/revert-merge-revert-revert.md
              - 从别的分支只摘一条提交过来: courses/git/cherry-pick-single.md
              - 从两个分支挑三条，还得按正确顺序摘: courses/git/cherry-pick-multi-ordered.md
              - 摘一段范围：中间一条要跳过，最后一条会冲突: courses/git/cherry-pick-skip-conflict.md
              - 跨仓库搬提交：先 fetch 进来，再 cherry-pick: courses/git/cherry-pick-range-cross-repo.md
