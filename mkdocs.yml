site_name: 牛合天's wiki
site_url: https://wiki.liuhetian.work/
copyright: >
  Copyright &copy; 2026 Liu Hetian ·
  <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">蜀ICP备2021023978号-2</a>

theme:
  name: material
  custom_dir: overrides   # 首页开屏模板 home.html 所在目录
  language: zh
  font: false   # 关掉 Google Fonts 远程引用（渲染阻塞，境内常超时）；字体本地化见 extra_css
  features:
    - navigation.tabs
    - navigation.indexes
    - content.code.copy
    - content.code.annotate

extra_css:
  - vendor/fonts/fonts.css       # 本地 Maple Mono（拉丁官方 woff2 + 自建中文子集），替代 fonts.googleapis.com；只出 --md-text-font/--md-code-font
  - stylesheets/zx-tokens.css    # 全站令牌层：Atelier Zero 令牌 + --md-*/--color-* 映射（首页 home.css 也用它）
  - stylesheets/zx-theme.css     # 全站皮肤层：只写选择器，消费上一层的变量

extra_javascript:
  - vendor/mathjax-init.js   # MathJax 配置 + 按需加载器；真身（vendor/mathjax/tex-svg.js，3.2.2，
                             #   SVG 输出免字体文件）2MB，只有含 .arithmatex 的页面才拉，不出外网
  - vendor/echarts-init.js   # ```echarts 代码块渲染器；真身按需动态加载，无图页面零开销
  - vendor/js-runner.js      # ```{.js .run} 代码块的运行器：Worker 沙箱执行 + 输出面板；零依赖，无可运行块的页面直接返回
  - vendor/conflict-init.js  # ```conflict 代码块（课程页的提问）染成上问下答两半；无此类块的页面直接返回
  - vendor/age-init.js       # 打码：`age:…` 小字和 ```age 块显示成马赛克，解锁后还原；有密文才按需加载 vendor/age-core.js

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - docs   # docs 内引用去掉 docs/ 前缀（如 skills/.../x.md），避免 AI 把 docs/ 当 URL
        - .      # 回退到项目根：mkdocs.yml / deploy.sh 等真实文件仍可被 --8<-- 引用
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: echarts   # 声明式图表：fence 里写 ECharts option JSON，vendor/echarts-init.js 渲染
          class: echarts
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: conflict  # 课程提问：fence 里写 git 冲突标记，上半是问、下半是答（见 courses/index.md）
          class: conflict
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: age       # 打码大段内容：fence 里放 age -a 的 armor 密文，vendor/age-init.js 显示成马赛克
          class: age
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

# MkDocs 插件。zensical 0.0.58 起把这几个插件用 Rust 重写进了本体，不用额外装 pip 包，
# 写上名字即可。显式声明 plugins 不会关掉搜索 —— 实测 site/search.json 照常产出。
plugins:

  # 目录级 frontmatter 默认值：某目录放一个 .meta.yml，里面的键给该目录**及其子目录**下
  # 所有页面当默认，页面自己的 frontmatter 优先。用来给两类不能动的文件补 description：
  # 上游原文照录的存档（改了就不是原文），和被 --8<-- 当 snippet 引用的真身（加 frontmatter
  # 会把 --- 和 description: 漏进引用它的正文里）。.meta.yml 不进 site/，也不会被
  # deploy.sh 那行只捞 *.md 的 rsync 带上桶。
  - meta

  # 挪文件时留重定向，替代旧地址存根页。左旧右新，都写 docs/ 内的相对路径；
  # 支持 old.md#anchor 形式的锚点级重定向（0.0.61+），改标题不炸别人的书签。
  # 注意它只修好人那一半：产物是 site/<旧路径>/index.html 里一条 meta refresh，
  # 而 .md 那一半是 deploy.sh 从 docs/ 实镜像出来的，旧的 /<旧路径>.md 仍然 404。
  # 所以挪文件依旧要把站内引用一并改掉，redirects 兜的是站外链接和别人的书签。
  - redirects:
      redirect_maps:
        # 2026-09-29 手绘风格库的版式、主题色单独成区：gallery/layouts/、gallery/colors/
