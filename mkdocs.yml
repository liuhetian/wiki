# 链接校验。0.0.53 及更早版本有并行竞态：同一份内容偶发（约 1/15 次构建）误报大量
# "page does not exist"，产物 HTML 实测无差异，只能关掉。0.0.62 上复现不出来了 ——
# 8 次 clean + 12 次增量构建零误报，并用一个故意的死链探针确认校验本身仍在工作，故重新打开。
# 用 warn 不用 fail：阻断部署的职责仍归 scripts/check-links.py（它还管另外四项 zensical
# 不看的事——父级索引挂载、nav 注册、笔记未答题、资源死链）。zensical 的价值是报错带
# 文件:行:列 定位，serve 时改错一个链接当场就能看见。竞态若复发，改回 false 即可，不丢保障。
# invalid_link_anchors（锚点校验）check-links.py 不覆盖，保持默认开启。
validation:
  invalid_links: warn

